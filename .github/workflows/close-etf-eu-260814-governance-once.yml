name: One-shot close ETF EU 260814 governance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/close-etf-eu-260814-governance-once.yml

permissions:
  contents: write

jobs:
  close-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Close work claim and record stable delivery decision
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          claims_path = Path('control/WORK_CLAIMS.json')
          payload = json.loads(claims_path.read_text(encoding='utf-8'))
          matches = [c for c in payload['claims'] if c.get('claim_id') == 'ETF-EU-FRESH-REPORT-260814-V1']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one ETF-EU-FRESH-REPORT-260814-V1 claim, found {len(matches)}')
          claim = matches[0]
          claim['status'] = 'CLOSED'
          claim['last_reconciled_target_sha'] = os.environ['GITHUB_SHA']
          claim['current_claim_head_sha'] = 'f230a17fb6504ff1513ade0f4cb0b6ac0e1a0b5b'
          claim['last_reconciled_at'] = '2026-08-18T06:25:00Z'
          claim['pull_request'] = 101
          claim['pull_request_or_issue_reference'] = (
              'Issue #100; PR #101 independently PASSed in issue #102 and merged unchanged; '
              'controlled transport run 32105981988 attempt 2 succeeded; recipient INBOX receipt '
              'and NL/EN attachment hashes confirmed; closeout manifest persisted.'
          )
          claim['protected_boundaries'] = {
              'model_portfolio_mutation': 'explicit current allocation decision only',
              'real_broker_execution': False,
              'report_delivery': True,
              'smtp_send': True,
              'independent_assurance_required': True,
              'delivery_portfolio_mutation': False,
          }
          validation = claim.setdefault('validation', {})
          validation.update({
              'report_date': '2026-08-14',
              'run_id': '20260814_235900',
              'assured_candidate_head_sha': 'f230a17fb6504ff1513ade0f4cb0b6ac0e1a0b5b',
              'independent_assurance_issue': 102,
              'independent_assurance_verdict': 'PASS',
              'merged_commit_sha': '7e20340eca82bfb9aad0b63ffeaae7291e7f14e6',
              'candidate_delivery_authority': True,
              'controlled_transport_workflow_run': 32105981988,
              'controlled_transport_attempt': 2,
              'controlled_transport_run_id': '20260818_061712',
              'report_delivery': True,
              'smtp_send': True,
              'receipt_confirmed': True,
              'attachment_hash_confirmation': True,
              'delivery_closeout_manifest': 'output/run_manifests/etf_eu_delivery_closeout_manifest_20260818_061712.json',
              'real_broker_execution': False,
          })
          claim['handover'] = {
              'disposition': 'CLOSE',
              'closeout_manifest': 'output/run_manifests/etf_eu_delivery_closeout_manifest_20260818_061712.json',
              'receipt_evidence': 'output/delivery/etf_eu_delivery_receipt_evidence_20260818_061712.json',
              'reason': 'Fresh 2026-08-14 cycle independently assured, merged, controlled-transported and recipient-side receipt/attachment integrity confirmed.'
          }
          claims_path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          log_path = Path('control/DECISION_LOG.md')
          heading = '## 2026-08-18 — Guarded delivery package safety assertions are explicit authority'
          log = log_path.read_text(encoding='utf-8')
          if heading not in log:
              section = f'''\n\n---\n\n{heading}\n\n### Decision\n\nGuarded Weekly ETF EU delivery must bind client-surface safety assertions explicitly in the machine delivery-authority and propagate them into the generated delivery-package manifest. Missing safety booleans fail closed; they are never inferred as safe.\n\nThe explicit false assertions are:\n\n```text\nstale_delivery_wording_present=false\nmain_surface_us_proxy_exposure=false\nmain_surface_tbd_candidate_exposure=false\nnan_price_in_client_surface=false\n```\n\n### Reason\n\nControlled transport run `32105981988` attempt 1 correctly failed before SMTP because the package writer omitted these fields while the package validator required them. The contract was repaired without changing any independently assured report artifact bytes. Attempt 2 passed the same guarded workflow and completed delivery.\n\n### Consequence\n\nThe delivery authority now references existing client-grade safety evidence, validates that each assertion is explicitly false, and the package writer copies those assertions into the delivery manifest. A missing assertion remains a transport blocker. Report rerendering is not an acceptable delivery-layer repair after independent artifact approval.\n'''
              log_path.write_text(log.rstrip() + section + '\n', encoding='utf-8')
          PY

      - name: Remove temporary one-shot workflow bridges
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/dispatch-etf-eu-controlled-transport-once.yml \
            .github/workflows/observe-etf-eu-controlled-transport-once.yml \
            .github/workflows/close-etf-eu-260814-governance-once.yml

      - name: Persist governance closeout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            control/WORK_CLAIMS.json \
            control/DECISION_LOG.md \
            .github/workflows/dispatch-etf-eu-controlled-transport-once.yml \
            .github/workflows/observe-etf-eu-controlled-transport-once.yml \
            .github/workflows/close-etf-eu-260814-governance-once.yml
          git commit -m "Close ETF EU 260814 delivery governance [skip ci]"
          git push origin HEAD:main
