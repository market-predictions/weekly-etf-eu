name: Diagnose Boerse overnight ETF payload

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-boerse-overnight-payload.yml"
      - "tools/probe_boerse_frankfurt_price_information.py"

permissions:
  contents: read

jobs:
  diagnose-overnight-payload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.32.3
      - name: Capture sanitized exact-line payload
        run: |
          mkdir -p output/provider_qualification
          python tools/probe_boerse_frankfurt_price_information.py \
            --report-date 2026-08-03 \
            --output output/provider_qualification/boerse_overnight_payload_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json
          cat output/provider_qualification/boerse_overnight_payload_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json
      - name: Upload sanitized payload
        uses: actions/upload-artifact@v4
        with:
          name: boerse-overnight-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/provider_qualification/*.json
          if-no-files-found: error
          retention-days: 30
