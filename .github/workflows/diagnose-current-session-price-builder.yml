name: Diagnose current-session funded price builder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-current-session-price-builder.yml"
      - "pricing/build_current_session_close_results.py"

permissions:
  contents: read

jobs:
  diagnose-funded-normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.32.3 PyYAML==6.0.2
      - name: Build and print normalized funded rows
        continue-on-error: true
        run: |
          mkdir -p output/pricing
          python pricing/build_current_session_close_results.py \
            --basket config/ucits_close_price_validation_basket.yml \
            --report-date 2026-08-03 \
            --run-id "20260803_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --output output/pricing/current_session_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json \
            --qualification-output output/pricing/current_session_qualification_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json
      - name: Print funded normalization
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('output/pricing').glob('current_session_qualification_*.json'))
          if not paths:
              print('QUALIFICATION_OUTPUT_MISSING')
              raise SystemExit(0)
          payload = json.loads(paths[0].read_text())
          print(json.dumps({
              'report_pricing_gate_passed': payload.get('report_pricing_gate_passed'),
              'funded_consensus_count': payload.get('funded_consensus_count'),
              'funded_identity_anchor_count': payload.get('funded_identity_anchor_count'),
              'lines': [row for row in payload.get('lines', []) if row.get('funded')],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-session-builder-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pricing/*.json
          if-no-files-found: warn
          retention-days: 30
