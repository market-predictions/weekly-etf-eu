name: Diagnose Weekly ETF EU 2026-08-03 expanded allocator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-weekly-etf-eu-20260803-expanded.yml"

permissions:
  contents: read

jobs:
  diagnose-expanded-allocator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_DATE: "2026-08-03"
      REPORT_SUFFIX: "260803_01"
      DONOR_COMMIT: "272ce2a997ae21c30290807199f243f491df3c46"
      RUN_ID: "20260803_${{ github.run_id }}_${{ github.run_attempt }}"
      SOURCE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: ${{ env.DONOR_COMMIT }}
          path: donor-weekly-etf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance weasyprint pypdf beautifulsoup4 pyyaml matplotlib requests
      - name: Run until first failure
        id: build
        continue-on-error: true
        run: |
          python tools/run_etf_eu_aug3_expanded_report.py \
            --donor-dir donor-weekly-etf \
            --report-date "$REPORT_DATE" \
            --report-suffix "$REPORT_SUFFIX" \
            --run-id "$RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --donor-commit "$DONOR_COMMIT"
      - name: Print Stage-1 diagnostic rows
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('output/routine_preview/sync/etf_eu_target_allocator_shadow.json')
          if not path.exists():
              print('ALLOCATOR_DIAGNOSTIC_MISSING')
              raise SystemExit(0)
          payload = json.loads(path.read_text())
          variants = {row.get('variant_id'): row for row in payload.get('variants', [])}
          preferred = variants.get('staged_policy_driven_v1', {})
          for row in preferred.get('allocation_rows', []):
              if row.get('exposure_id') in {'ai_compute_infrastructure', 'cyber_security'}:
                  print(json.dumps(row, indent=2, sort_keys=True))
          print(json.dumps(preferred.get('summary', {}), indent=2, sort_keys=True))
          PY
      - name: Upload partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-expanded-allocator-diagnostic-${{ env.RUN_ID }}
          path: |
            output/routine_preview/sync/
            output/pricing/
            output/macro/
            output/routine_preview/etf_eu_routine_valuation_overlay_*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve failure status
        if: steps.build.outcome != 'success'
        run: exit 1
