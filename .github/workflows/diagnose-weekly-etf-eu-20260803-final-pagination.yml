name: Diagnose Weekly ETF EU 2026-08-03 final pagination

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-weekly-etf-eu-20260803-final-pagination.yml"

permissions:
  contents: read

jobs:
  diagnose-final-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPORT_DATE: "2026-08-03"
      REPORT_SUFFIX: "260803_03"
      DONOR_COMMIT: "272ce2a997ae21c30290807199f243f491df3c46"
      RUN_ID: "20260803_${{ github.run_id }}_${{ github.run_attempt }}"
      SOURCE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: ${{ env.DONOR_COMMIT }}
          path: donor-weekly-etf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install yfinance weasyprint pypdf beautifulsoup4 pyyaml matplotlib requests
      - name: Build release candidate through pagination check
        id: build
        continue-on-error: true
        run: |
          python tools/run_etf_eu_aug3_expanded_report_v4.py \
            --donor-dir donor-weekly-etf \
            --report-date "$REPORT_DATE" \
            --report-suffix "$REPORT_SUFFIX" \
            --run-id "$RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --donor-commit "$DONOR_COMMIT"
      - name: Extract PDF page text counts
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz

          report = {}
          for path in sorted(Path('output/fresh_generation').glob('*.pdf')):
              doc = fitz.open(path)
              report[path.name] = [len(page.get_text().strip()) for page in doc]
          out = Path('output/routine_preview/final_pagination_diagnostic.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(out.read_text())
          PY
      - name: Upload complete failed candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-final-pagination-diagnostic-${{ env.RUN_ID }}
          path: |
            output/routine_preview/
            output/fresh_generation/
            output/run_manifests/
            output/pricing/
            output/macro/
            output/etf_eu_valuation_history.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve build failure status
        if: steps.build.outcome != 'success'
        run: exit 1
