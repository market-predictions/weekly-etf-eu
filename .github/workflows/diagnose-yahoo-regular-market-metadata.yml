name: Diagnose Yahoo regular-market ETF metadata

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/diagnose-yahoo-regular-market-metadata.yml"
      - "tools/probe_yahoo_regular_market_metadata.py"

permissions:
  contents: read

jobs:
  diagnose-yahoo-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests==2.32.3
      - name: Probe safe chart metadata
        run: |
          mkdir -p output/provider_qualification
          python tools/probe_yahoo_regular_market_metadata.py \
            --report-date 2026-08-03 \
            --output output/provider_qualification/yahoo_regular_market_metadata_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json
          cat output/provider_qualification/yahoo_regular_market_metadata_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json
      - name: Upload metadata evidence
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-regular-market-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/provider_qualification/*.json
          if-no-files-found: error
          retention-days: 30
