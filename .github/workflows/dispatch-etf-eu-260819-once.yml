name: Dispatch ETF EU fresh 260819 once

on:
  push:
    branches:
      - ops/dispatch-etf-eu-260819-once
    paths:
      - .github/workflows/dispatch-etf-eu-260819-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-weekly-etf-eu-routine.yml/dispatches \
            -d '{"ref":"agent/etf-eu-fresh-260819-v1","inputs":{"request_path":"control/requests/ETF_EU_FRESH_260819.request"}}'
          echo "DISPATCHED_CANONICAL_ETF_EU_ROUTINE=true"
          echo "REDISPATCH_REASON=align_derived_valuation_with_primary_plus_verification"
