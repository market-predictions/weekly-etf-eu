name: One-shot dispatch Weekly ETF EU controlled transport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-etf-eu-controlled-transport-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-controlled-transport:
    if: github.repository == 'market-predictions/weekly-etf-eu'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sole controlled transport workflow
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_PATH: output/delivery_authorization/etf_eu_guarded_delivery_authority_20260814_235900.json
        run: |
          set -euo pipefail
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/send-weekly-etf-eu-controlled-transport.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"delivery_authority_path\":\"${AUTHORITY_PATH}\",\"delivery_mode\":\"send\",\"send_confirmation\":\"confirm_guarded_send\",\"second_confirmation\":\"confirm_guarded_send_second\"}}")"
          if [ "$response_code" != "204" ]; then
            cat /tmp/dispatch-response.txt >&2 || true
            echo "ETF_EU_CONTROLLED_TRANSPORT_DISPATCH_FAILED_HTTP_${response_code}" >&2
            exit 1
          fi
          echo "ETF_EU_CONTROLLED_TRANSPORT_DISPATCH_ACCEPTED"

      - name: Persist dispatch acceptance marker
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_PATH: output/delivery_authorization/etf_eu_guarded_delivery_authority_20260814_235900.json
        run: |
          set -euo pipefail
          marker_path="output/delivery_control/etf_eu_controlled_transport_dispatch_20260818.json"
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg authority_path "$AUTHORITY_PATH" \
            --arg workflow "send-weekly-etf-eu-controlled-transport.yml" \
            '{schema_version:"etf_eu_transport_dispatch_marker_v1",status:"DISPATCH_ACCEPTED_BY_GITHUB_API",source_sha:$source_sha,authority_path:$authority_path,workflow:$workflow,delivery_mode:"send",send_confirmation:"confirm_guarded_send",second_confirmation:"confirm_guarded_send_second"}' \
            > /tmp/marker.json
          encoded="$(base64 -w0 /tmp/marker.json)"
          payload="$(jq -n --arg message 'Record accepted ETF EU controlled transport dispatch' --arg content "$encoded" --arg branch 'main' '{message:$message,content:$content,branch:$branch}')"
          code="$(curl -sS -o /tmp/marker-response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker_path}" \
            -d "$payload")"
          if [ "$code" != "201" ]; then
            cat /tmp/marker-response.json >&2 || true
            echo "ETF_EU_DISPATCH_MARKER_PERSIST_FAILED_HTTP_${code}" >&2
            exit 1
          fi
          echo "ETF_EU_DISPATCH_MARKER_PERSISTED"
