name: One-shot dispatch Weekly ETF EU fresh 260817 candidate

on:
  push:
    branches:
      - ops/dispatch-etf-eu-fresh-260817-once
    paths:
      - .github/workflows/dispatch-etf-eu-fresh-260817-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-candidate:
    if: github.repository == 'market-predictions/weekly-etf-eu'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: agent/etf-eu-fresh-260817-v1
          REQUEST_PATH: requests/etf_eu_routine_report_request_20260817_151400.env
        run: |
          set -euo pipefail
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-weekly-etf-eu-routine.yml/dispatches" \
            -d "{\"ref\":\"${CANDIDATE_REF}\",\"inputs\":{\"request_path\":\"${REQUEST_PATH}\"}}")"
          if [ "$response_code" != "204" ]; then
            cat /tmp/dispatch-response.txt >&2 || true
            echo "ETF_EU_CANDIDATE_DISPATCH_FAILED_HTTP_${response_code}" >&2
            exit 1
          fi
          echo "ETF_EU_CANDIDATE_DISPATCH_ACCEPTED"
          echo "ETF_EU_CANDIDATE_REF=${CANDIDATE_REF}"
          echo "ETF_EU_REQUEST_PATH=${REQUEST_PATH}"
          echo "ETF_EU_DELIVERY_AUTHORITY=false"
