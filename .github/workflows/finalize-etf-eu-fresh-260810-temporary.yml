name: TEMP Rerender ETF EU fresh 260810 candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/etf-eu-fresh-260810-v1
    paths:
      - ".github/workflows/finalize-etf-eu-fresh-260810-temporary.yml"
      - "runtime/reconcile_etf_eu_funded_markdown.py"
      - "runtime/apply_etf_eu_donor_parity_contract.py"
      - "runtime/build_etf_eu_client_grade_report_state_v2.py"
      - "runtime/finalize_etf_eu_markdown_semantics.py"
      - "tools/build_etf_eu_routine_report_package_v2.py"
      - "output/activation/etf_eu_current_allocation_decision_20260810_123000.json"

permissions:
  contents: write

jobs:
  rerender-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Require fresh candidate branch
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/etf-eu-fresh-260810-v1"
          test "${GITHUB_REF_NAME}" != "main"

      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-liberation fonts-dejavu-core fonts-lato poppler-utils
          python -m pip install --upgrade pip
          pip install pyyaml mistune weasyprint pytest

      - name: Verify six-position model activation is already applied
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('output/etf_eu_portfolio_state.json').read_text())
          activation = state.get('last_model_capital_activation') or {}
          assert activation.get('activation_id') == 'ETF-EU-CURRENT-20260810_123000', activation
          assert len(state.get('positions') or []) == 6
          assert round(float(state.get('cash_eur')), 2) == 28101.01
          tickers = {str(row.get('ticker') or row.get('exchange_ticker')).upper() for row in state['positions']}
          assert tickers == {'VWCE','EUNA','SXR8','L0CK','DFEN','IQQQ'}, tickers
          print('ETF_EU_APPLIED_SIX_POSITION_STATE=PASS')
          PY

      - name: Run current discovery and Markdown regressions
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_etf_eu_broad_discovery_allocation_pricing.py
          python -m py_compile runtime/apply_etf_eu_donor_parity_contract.py runtime/reconcile_etf_eu_funded_markdown.py runtime/finalize_etf_eu_markdown_semantics.py

      - name: Build final client package from applied state and persisted evidence
        run: |
          set -euo pipefail
          python -m tools.build_etf_eu_routine_report_package_v2 \
            --run-id 20260810_123000 \
            --report-date 2026-08-10 \
            --report-suffix 260810 \
            --pricing-artifact output/pricing/ucits_close_price_validation_basket_results_20260810_120500.json \
            --macro-pack output/macro/etf_eu_macro_policy_pack_20260810_120500.json \
            --registry config/ucits_symbol_registry.yml \
            --proxy-map config/ucits_benchmark_proxy_map.yml \
            --donor-lane-artifact output/runtime/etf_eu_donor_lane_source_20260810_120500.json \
            --previous-routine-manifest output/run_manifests/etf_eu_routine_run_manifest_2026-08-05_20260805_31342220143_2.json \
            --previous-delivery-closeout-manifest output/run_manifests/etf_eu_delivery_closeout_manifest_20260710_1755.json

      - name: Validate current allocation and cash classification in normalized state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('output/runtime/etf_eu_client_grade_report_state_20260810_123000.json').read_text())
          assert state['cash_policy']['cash_classification'] == 'Deployment candidate', state['cash_policy']
          assert state['cash_policy']['cash_classification_complete'] is True
          assert state['cash_policy']['deploy_or_explain_explained'] is True
          assert set(state['current_allocation_decision']['added_tickers']) == {'DFEN','IQQQ'}
          by_ticker = {row['ticker']: row for row in state['recommendation_memory']}
          assert by_ticker['DFEN']['reunderwriting_complete'] is True, by_ticker['DFEN']
          assert by_ticker['IQQQ']['reunderwriting_complete'] is True, by_ticker['IQQQ']
          print('ETF_EU_CURRENT_ALLOCATION_STATE=PASS')
          PY

      - name: Validate all six final client artifacts
        run: |
          set -euo pipefail
          python -m tools.validate_etf_eu_client_grade_report_v2 \
            --state output/runtime/etf_eu_client_grade_report_state_20260810_123000.json \
            --dutch-html output/fresh_generation/weekly_etf_eu_review_nl_260810.html \
            --dutch-pdf output/fresh_generation/weekly_etf_eu_review_nl_260810.pdf \
            --english-html output/fresh_generation/weekly_etf_eu_review_260810.html \
            --english-pdf output/fresh_generation/weekly_etf_eu_review_260810.pdf \
            --output output/quality/etf_eu_client_grade_v2_validation_20260810_123000.json \
            --strict
          python -m tools.validate_etf_eu_markdown_delivery_artifacts \
            --state output/runtime/etf_eu_client_grade_report_state_20260810_123000.json \
            --dutch-markdown output/fresh_generation/weekly_etf_eu_review_nl_260810.md \
            --english-markdown output/fresh_generation/weekly_etf_eu_review_260810.md \
            --output output/quality/etf_eu_markdown_delivery_validation_20260810_123000.json \
            --strict
          python -m tools.write_etf_eu_routine_v2_machine_gate \
            --validation output/quality/etf_eu_client_grade_v2_validation_20260810_123000.json \
            --run-id 20260810_123000 \
            --output-dir output/quality

      - name: Assert client-visible fresh changes and pricing semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          nl = Path('output/fresh_generation/weekly_etf_eu_review_nl_260810.md').read_text(encoding='utf-8')
          en = Path('output/fresh_generation/weekly_etf_eu_review_260810.md').read_text(encoding='utf-8')
          assert 'DFEN en IQQQ deze run toegevoegd' in nl
          assert 'added DFEN and IQQQ this run' in en
          assert '6 van 6 gefinancierde lijnen' in nl
          assert '6 of 6 funded lines' in en
          assert 'Volledig geverifieerde lijnen: 0' not in nl
          assert 'Fully verified lines: 0' not in en
          assert 'Beste operationele kandidaat: de geverifieerde S&P 500' not in nl
          assert 'Best operational candidate: the verified S&P 500' not in en
          assert 'Een prijsobservatie is geen zelfstandige waarderingsbasis.' not in nl
          assert 'A price observation is not an independent valuation basis.' not in en
          assert 'Nieuwe funded implementaties: DFEN en IQQQ' in nl
          assert 'New funded implementations: DFEN and IQQQ' in en
          print('ETF_EU_CLIENT_CHANGE_DISCLOSURE=PASS')
          PY

      - name: Render final PDF review pages
        run: |
          set -euo pipefail
          REVIEW_ROOT=output/quality/review_pages/20260810_123000
          rm -rf "$REVIEW_ROOT"
          mkdir -p "$REVIEW_ROOT/nl/all" "$REVIEW_ROOT/en/all"
          python tools/render_etf_eu_pdf_review_pages.py --pdf output/fresh_generation/weekly_etf_eu_review_nl_260810.pdf --output-dir "$REVIEW_ROOT/nl" --write-index "$REVIEW_ROOT/nl/index.json"
          python tools/render_etf_eu_pdf_review_pages.py --pdf output/fresh_generation/weekly_etf_eu_review_260810.pdf --output-dir "$REVIEW_ROOT/en" --write-index "$REVIEW_ROOT/en/index.json"
          pdftoppm -png -r 120 output/fresh_generation/weekly_etf_eu_review_nl_260810.pdf "$REVIEW_ROOT/nl/all/page"
          pdftoppm -png -r 120 output/fresh_generation/weekly_etf_eu_review_260810.pdf "$REVIEW_ROOT/en/all/page"

      - name: Persist rerendered final candidate to branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            output/etf_eu_recommendation_scorecard.csv \
            output/runtime/etf_eu_donor_discovery_bridge_20260810_123000.json \
            output/runtime/etf_eu_client_grade_report_state_20260810_123000.json \
            output/fresh_generation/weekly_etf_eu_review_nl_260810.md \
            output/fresh_generation/weekly_etf_eu_review_260810.md \
            output/fresh_generation/weekly_etf_eu_review_nl_260810.html \
            output/fresh_generation/weekly_etf_eu_review_260810.html \
            output/fresh_generation/weekly_etf_eu_review_nl_260810.pdf \
            output/fresh_generation/weekly_etf_eu_review_260810.pdf \
            output/fresh_generation/etf_eu_fresh_generation_package_manifest_20260810_123000.json \
            output/fresh_generation/etf_eu_ready_for_controlled_delivery_20260810_123000.json \
            output/quality/etf_eu_client_grade_v2_validation_20260810_123000.json \
            output/quality/etf_eu_markdown_delivery_validation_20260810_123000.json \
            output/quality/etf_eu_routine_pdf_client_grade_20260810_123000_nl.json \
            output/quality/etf_eu_routine_pdf_client_grade_20260810_123000_en.json \
            output/quality/etf_eu_routine_pdf_client_grade_20260810_123000.json \
            output/run_manifests/etf_eu_routine_run_manifest_2026-08-10_20260810_123000.json
          if git diff --cached --quiet; then
            echo "ETF_EU_RERENDER_UNCHANGED"
          else
            git commit -m "Rerender final ETF EU 260810 client candidate [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: State governance boundary
        run: |
          echo "ETF_EU_FINAL_MODEL_CANDIDATE_RERENDERED=true"
          echo "ETF_EU_MODEL_MUTATION_THIS_RERENDER=false"
          echo "ETF_EU_REAL_BROKER_EXECUTION=false"
          echo "ETF_EU_INDEPENDENT_ASSURANCE_REQUIRED=true"
          echo "ETF_EU_DELIVERY_AUTHORITY=false"
