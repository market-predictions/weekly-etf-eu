name: Legacy FX generator — quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "ETF_EU_LEGACY_FX_GENERATOR_QUARANTINED"
          echo "This repository workflow previously invoked prediction.py and daily_outputs/latest, which belong to a legacy FX prediction path rather than the Weekly ETF EU report pipeline."
          echo "The scheduled triggers and write permissions have been removed. Use the governed Weekly ETF EU production workflows instead."
