name: Legacy FX prediction workflow (disabled)

# This repository is the Weekly ETF EU product. The retained prediction.py entrypoint
# is an inherited FX diagnostic and is not a valid ETF EU production runner.
# The former schedules are intentionally removed. The disabled job remains visible
# as migration provenance until a later archive/delete work package is approved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-fx-diagnostic-disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled legacy path
        run: |
          echo "Disabled: prediction.py is an inherited FX diagnostic, not the Weekly ETF EU report generator."
          echo "Use the governed Weekly ETF EU routine registered in control/SYSTEM_INDEX.md."
