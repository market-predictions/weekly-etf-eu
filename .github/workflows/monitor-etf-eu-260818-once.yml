name: Monitor ETF EU fresh 260818 once

on:
  push:
    branches:
      - ops/dispatch-etf-eu-260818-once
    paths:
      - .github/workflows/monitor-etf-eu-260818-once.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Poll canonical run and persist evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OPS_BRANCH: ops/dispatch-etf-eu-260818-once
          TARGET_BRANCH: agent/etf-eu-fresh-260818-v1
          WORKFLOW: run-weekly-etf-eu-routine.yml
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, time, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_BRANCH']; wf=os.environ['WORKFLOW']; ops=os.environ['OPS_BRANCH']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url, raw=False):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:
                  data=r.read()
                  return data if raw else json.loads(data.decode())
          run=None
          for _ in range(90):
              data=get(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch={target}&event=workflow_dispatch&per_page=10')
              runs=data.get('workflow_runs',[])
              if runs:
                  run=runs[0]
                  if run.get('status')=='completed': break
              time.sleep(10)
          if not run:
              evidence={'found':False,'target_branch':target,'failure':'No workflow_dispatch run found within monitor window'}
          else:
              jobs=get(run['jobs_url']).get('jobs',[])
              evidence={'found':True,'run':{k:run.get(k) for k in ['id','name','status','conclusion','html_url','head_sha','created_at','updated_at','run_attempt']},'jobs':[]}
              for job in jobs:
                  j={'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),'conclusion':job.get('conclusion'),'steps':[{k:s.get(k) for k in ['name','status','conclusion','number']} for s in job.get('steps',[])]}
                  if job.get('conclusion') not in (None,'success','skipped'):
                      try:
                          text=get(f'https://api.github.com/repos/{repo}/actions/jobs/{job["id"]}/logs',raw=True).decode('utf-8','replace')
                          lines=text.splitlines()
                          interesting=[ln for ln in lines if any(x in ln.lower() for x in ['error','assert','traceback','failed','block','exception','no exact','identity','pricing'])]
                          j['log_evidence']=(interesting[-80:] or lines[-80:])
                      except Exception as exc:
                          j['log_fetch_error']=repr(exc)
                  evidence['jobs'].append(j)
          raw=(json.dumps(evidence,indent=2)+'\n').encode()
          path='ops/evidence/ETF_EU_FRESH_260818_RUN.json'
          url=f'https://api.github.com/repos/{repo}/contents/{path}'
          payload={'message':'Persist ETF EU 260818 run evidence','content':base64.b64encode(raw).decode(),'branch':ops}
          req=urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print(r.read().decode())
          print(json.dumps(evidence,indent=2))
          PY
