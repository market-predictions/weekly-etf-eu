name: Monitor ETF EU fresh 260819 once

on:
  push:
    branches:
      - ops/dispatch-etf-eu-260819-once
    paths:
      - .github/workflows/monitor-etf-eu-260819-once.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/dispatch-etf-eu-260819-once
      - name: Snapshot canonical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 20
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url, headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: return json.load(r)
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/run-weekly-etf-eu-routine.yml/runs?branch=agent%2Fetf-eu-fresh-260819-v1&per_page=5').get('workflow_runs',[])
          out={'found':bool(runs),'monitor_revision':'after_valuation_repair'}
          if runs:
              r=runs[0]
              out['run']={k:r.get(k) for k in ['id','name','status','conclusion','html_url','head_sha','created_at','updated_at','run_attempt']}
              jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{r["id"]}/jobs?per_page=100').get('jobs',[])
              out['jobs']=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':j.get('steps')} for j in jobs]
          os.makedirs('ops/evidence',exist_ok=True)
          open('ops/evidence/ETF_EU_FRESH_260819_SNAPSHOT.json','w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/ETF_EU_FRESH_260819_SNAPSHOT.json
          git commit -m 'Refresh ETF EU fresh 260819 run snapshot' || true
          git push origin HEAD:ops/dispatch-etf-eu-260819-once
