name: One-shot observe Weekly ETF EU controlled transport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/observe-etf-eu-controlled-transport-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe-controlled-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Read latest controlled transport workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/send-weekly-etf-eu-controlled-transport.yml/runs?event=workflow_dispatch&branch=main&per_page=10"
          curl -sS --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url" > /tmp/runs.json
          jq -e '.workflow_runs | length > 0' /tmp/runs.json >/dev/null
          jq '.workflow_runs[0] | {id,run_number,run_attempt,status,conclusion,event,head_branch,head_sha,created_at,updated_at,html_url}' /tmp/runs.json > /tmp/latest.json
          cat /tmp/latest.json

      - name: Persist run observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker_path="output/delivery_control/etf_eu_controlled_transport_run_observation_20260818.json"
          jq -n \
            --slurpfile run /tmp/latest.json \
            '{schema_version:"etf_eu_transport_run_observation_v1",observed_run:$run[0]}' > /tmp/marker.json
          encoded="$(base64 -w0 /tmp/marker.json)"
          payload="$(jq -n --arg message 'Record ETF EU controlled transport run observation' --arg content "$encoded" --arg branch 'main' '{message:$message,content:$content,branch:$branch}')"
          code="$(curl -sS -o /tmp/marker-response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker_path}" \
            -d "$payload")"
          if [ "$code" != "201" ]; then
            cat /tmp/marker-response.json >&2 || true
            echo "ETF_EU_RUN_OBSERVATION_PERSIST_FAILED_HTTP_${code}" >&2
            exit 1
          fi
