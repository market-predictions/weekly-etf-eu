name: One-shot observe Weekly ETF EU fresh 260817 candidate

on:
  push:
    branches:
      - ops/dispatch-etf-eu-fresh-260817-once
    paths:
      - .github/workflows/observe-etf-eu-fresh-260817-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe-candidate:
    if: github.repository == 'market-predictions/weekly-etf-eu'
    runs-on: ubuntu-latest
    steps:
      - name: Observe dispatched canonical candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: agent/etf-eu-fresh-260817-v1
          NOT_BEFORE: 2026-08-18T13:17:00Z
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-weekly-etf-eu-routine.yml/runs?branch=${CANDIDATE_REF}&event=workflow_dispatch&per_page=10"
          curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url" > /tmp/runs.json
          jq --arg not_before "$NOT_BEFORE" '
            [.workflow_runs[] | select(.created_at >= $not_before)]
            | sort_by(.created_at)
            | reverse
            | .[0] // error("no matching dispatched candidate run found")
            | {
                schema_version:"etf_eu_candidate_dispatch_observation_v1",
                workflow:"run-weekly-etf-eu-routine.yml",
                candidate_ref:.head_branch,
                run_id:.id,
                run_number:.run_number,
                status:.status,
                conclusion:.conclusion,
                event:.event,
                head_sha:.head_sha,
                created_at:.created_at,
                updated_at:.updated_at,
                html_url:.html_url
              }
          ' /tmp/runs.json > /tmp/observation.json
          cat /tmp/observation.json

      - name: Persist observation on isolated ops branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker_path="output/ops/etf_eu_candidate_dispatch_observation_20260817_151400.json"
          encoded="$(base64 -w0 /tmp/observation.json)"
          payload="$(jq -n --arg message 'Record ETF EU 260817 candidate dispatch observation' --arg content "$encoded" --arg branch 'ops/dispatch-etf-eu-fresh-260817-once' '{message:$message,content:$content,branch:$branch}')"
          code="$(curl -sS -o /tmp/marker-response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker_path}" \
            -d "$payload")"
          if [ "$code" != "201" ]; then
            cat /tmp/marker-response.json >&2 || true
            echo "ETF_EU_CANDIDATE_OBSERVATION_PERSIST_FAILED_HTTP_${code}" >&2
            exit 1
          fi
          echo "ETF_EU_CANDIDATE_OBSERVATION_PERSISTED"
