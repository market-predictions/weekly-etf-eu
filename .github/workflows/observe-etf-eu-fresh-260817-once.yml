name: One-shot observe Weekly ETF EU fresh 260817 candidate

on:
  push:
    branches:
      - ops/dispatch-etf-eu-fresh-260817-once
    paths:
      - .github/workflows/observe-etf-eu-fresh-260817-once.yml

permissions:
  actions: read
  contents: write

jobs:
  observe-diagnostic:
    if: github.repository == 'market-predictions/weekly-etf-eu'
    runs-on: ubuntu-latest
    steps:
      - name: Observe isolated pricing diagnostic run
        env:
          GH_TOKEN: ${{ github.token }}
          NOT_BEFORE: 2026-08-18T13:26:00Z
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/diagnose-etf-eu-pricing-260817-once.yml/runs?branch=ops/dispatch-etf-eu-fresh-260817-once&event=push&per_page=10"
          curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$url" > /tmp/runs.json
          jq --arg not_before "$NOT_BEFORE" '[.workflow_runs[] | select(.created_at >= $not_before)] | sort_by(.created_at) | reverse | .[0] // error("no diagnostic run") | {schema_version:"etf_eu_pricing_diagnostic_observation_v1",run_id:.id,status:.status,conclusion:.conclusion,head_sha:.head_sha,created_at:.created_at,updated_at:.updated_at,html_url:.html_url}' /tmp/runs.json > /tmp/observation.json
          cat /tmp/observation.json
      - name: Persist observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker_path='output/ops/etf_eu_pricing_diagnostic_run_observation_20260817_151400.json'
          existing_code="$(curl -sS -o /tmp/existing.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker_path}?ref=ops/dispatch-etf-eu-fresh-260817-once")"
          sha_arg='{}'
          if [ "$existing_code" = '200' ]; then sha_arg="$(jq -n --arg sha "$(jq -r .sha /tmp/existing.json)" '{sha:$sha}')"; fi
          encoded="$(base64 -w0 /tmp/observation.json)"
          payload="$(jq -n --arg message 'Observe ETF EU 260817 pricing diagnostic run' --arg content "$encoded" --arg branch 'ops/dispatch-etf-eu-fresh-260817-once' --argjson extra "$sha_arg" '{message:$message,content:$content,branch:$branch} + $extra')"
          code="$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker_path}" -d "$payload")"
          if [ "$code" != '201' ] && [ "$code" != '200' ]; then cat /tmp/resp.json >&2; exit 1; fi
