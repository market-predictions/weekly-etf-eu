name: Patch ETF EU equity validator and dispatch

on:
  push:
    branches:
      - ops/patch-etf-eu-equity-validator-260819
    paths:
      - .github/workflows/patch-etf-eu-equity-validator-260819.yml

permissions:
  actions: write
  contents: write

jobs:
  patch-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/etf-eu-fresh-260819-v1
          fetch-depth: 0
      - name: Align equity validator with PNG contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/validate_etf_eu_client_grade_report_v2_standalone.py')
          s=p.read_text(encoding='utf-8')
          old='''    svg_visible = 'class="equity-curve-svg"' in html\n    cash_callout_visible = 'class="cash-callout"' in html\n    if curve.get("show_chart") is True:\n        if not svg_visible:\n            blockers.append("equity curve should be visible but is absent")\n        if curve.get("latest_nav_matches_state") is not True:\n            blockers.append("equity curve does not reconcile to current NAV")\n    else:\n        if svg_visible:\n            blockers.append("equity curve is visible despite insufficient meaningful history")\n        if not cash_callout_visible:\n            blockers.append("cash-preservation callout missing while equity curve is suppressed")\n'''
          new='''    equity_image_visible = 'class="equity-curve-image"' in html and 'data:image/png;base64,' in html\n    residual_equity_svg = 'class="equity-curve-svg"' in html\n    cash_callout_visible = 'class="cash-callout"' in html\n    if curve.get("show_chart") is True:\n        if not equity_image_visible:\n            blockers.append("equity curve should be visible but is absent")\n        if residual_equity_svg:\n            blockers.append("residual inline equity SVG remains after PNG materialization")\n        if curve.get("latest_nav_matches_state") is not True:\n            blockers.append("equity curve does not reconcile to current NAV")\n    else:\n        if equity_image_visible or residual_equity_svg:\n            blockers.append("equity curve is visible despite insufficient meaningful history")\n        if not cash_callout_visible:\n            blockers.append("cash-preservation callout missing while equity curve is suppressed")\n'''
          if old not in s:
              raise SystemExit('EXPECTED_EQUITY_VALIDATOR_BLOCK_NOT_FOUND')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
          python -m py_compile tools/validate_etf_eu_client_grade_report_v2_standalone.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validate_etf_eu_client_grade_report_v2_standalone.py
          git commit -m 'Align equity QA with PNG materialization contract'
          git push origin HEAD:agent/etf-eu-fresh-260819-v1
      - name: Dispatch repaired candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-weekly-etf-eu-routine.yml/dispatches \
            -d '{"ref":"agent/etf-eu-fresh-260819-v1","inputs":{"request_path":"control/requests/ETF_EU_FRESH_260819.request"}}'
