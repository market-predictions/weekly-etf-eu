name: Patch Yahoo daily-bar request window

on:
  push:
    branches:
      - routine/20260803-expanded-funded-report
    paths:
      - ".github/workflows/patch-yahoo-period2-window.yml"

permissions:
  contents: write

jobs:
  patch-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routine/20260803-expanded-funded-report
      - name: Widen period2 without widening accepted close date
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('pricing/build_current_session_close_results.py'),
              Path('tools/probe_yahoo_boerse_close_agreement.py'),
          ]
          old = "report_date + timedelta(days=1)"
          new = "report_date + timedelta(days=2)"
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one period2 expression, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'PATCHED {path}')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pricing/build_current_session_close_results.py tools/probe_yahoo_boerse_close_agreement.py
          git commit -m "Fix Yahoo German daily-bar request window"
          git push origin HEAD:routine/20260803-expanded-funded-report
