name: Preview Weekly ETF EU 2026-08-03 expanded report v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/preview-weekly-etf-eu-20260803-expanded-v2.yml"
      - "tools/run_etf_eu_aug3_expanded_report.py"
      - "runtime/build_etf_eu_current_macro_source.py"
      - "runtime/add_etf_eu_current_close_monitor.py"
      - "pricing/build_current_session_close_results.py"

permissions:
  contents: read

jobs:
  preview-expanded-routine-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REPORT_DATE: "2026-08-03"
      REPORT_SUFFIX: "260803_01"
      DONOR_COMMIT: "272ce2a997ae21c30290807199f243f491df3c46"
      RUN_ID: "20260803_${{ github.run_id }}_${{ github.run_attempt }}"
      SOURCE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Checkout current Weekly ETF donor
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: ${{ env.DONOR_COMMIT }}
          path: donor-weekly-etf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install yfinance weasyprint pypdf beautifulsoup4 pyyaml matplotlib requests

      - name: Build and validate expanded fresh report
        run: |
          set -euo pipefail
          python tools/run_etf_eu_aug3_expanded_report.py \
            --donor-dir donor-weekly-etf \
            --report-date "$REPORT_DATE" \
            --report-suffix "$REPORT_SUFFIX" \
            --run-id "$RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --donor-commit "$DONOR_COMMIT"

      - name: Upload expanded report evidence
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-expanded-report-v2-${{ env.RUN_ID }}
          path: |
            output/routine_preview/
            output/fresh_generation/weekly_etf_eu_review*260803_01*
            output/run_manifests/etf_eu_routine_run_manifest_2026-08-03_${{ env.RUN_ID }}.json
            output/pricing/ucits_close_price_validation_basket_results_${{ env.RUN_ID }}.json
            output/pricing/ucits_price_provider_qualification_${{ env.RUN_ID }}.json
            output/macro/etf_eu_current_macro_source_${{ env.RUN_ID }}.json
            output/macro/etf_eu_macro_policy_${{ env.RUN_ID }}.json
            output/etf_eu_valuation_history.csv
          if-no-files-found: error
          retention-days: 90
