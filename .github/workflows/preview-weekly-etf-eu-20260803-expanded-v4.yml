name: Legacy ETF EU August 3 package preview — quarantined

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantine-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement
        run: |
          echo "ETF_EU_LEGACY_AUGUST3_PACKAGE_PREVIEW_QUARANTINED"
          echo "This workflow is pinned to report date 2026-08-03 and a superseded package suffix."
          echo "It must not evaluate the current August 5 release candidate or trigger duplicate package builds."
          echo "Use the canonical fresh production package workflow."
