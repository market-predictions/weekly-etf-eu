name: Probe Börse Frankfurt price history

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pricing/probe_boerse_frankfurt_price_history_v2.py"
      - ".github/workflows/probe-boerse-frankfurt-price-history.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Run signature variants
        run: |
          mkdir -p output/allocator_shadow
          python pricing/probe_boerse_frankfurt_price_history_v2.py \
            --output output/allocator_shadow/boerse_frankfurt_price_history_probe_v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boerse-frankfurt-price-history-probe
          path: output/allocator_shadow/boerse_frankfurt_price_history_probe_v2.json
          if-no-files-found: error
