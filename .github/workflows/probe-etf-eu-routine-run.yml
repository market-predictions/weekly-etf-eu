name: ETF EU - Probe routine run status

on:
  push:
    branches:
      - main
    paths:
      - "control/run_queue/etf_eu_routine_run_probe_*.md"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve probe request
        run: |
          set -euo pipefail
          REQUEST_PATH="$(git diff-tree --no-commit-id --name-only -r HEAD | grep '^control/run_queue/etf_eu_routine_run_probe_.*\.md$' | head -1)"
          test -f "$REQUEST_PATH"
          python - "$REQUEST_PATH" <<'PY'
          import sys
          from pathlib import Path
          data={}
          for raw in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              raw=raw.strip()
              if raw and not raw.startswith('#') and '=' in raw:
                  k,v=raw.split('=',1); data[k.strip()]=v.strip()
          required={'target_run_identity','target_head_sha','target_workflow'}
          missing=sorted(required-set(data))
          if missing: raise SystemExit('PROBE_REQUEST_MISSING:'+','.join(missing))
          mapping={'TARGET_RUN_IDENTITY':data['target_run_identity'],'TARGET_SHA':data['target_head_sha'],'TARGET_WORKFLOW':data['target_workflow']}
          Path('probe.env').write_text(''.join(f'{k}={v}\n' for k,v in mapping.items()),encoding='utf-8')
          PY
          cat probe.env >> "$GITHUB_ENV"
      - name: Probe target run and record result
        run: |
          set -uo pipefail
          mkdir -p output/run_manifests
          PROBE_ERROR=""
          RAW="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TARGET_WORKFLOW" --limit 50 --json databaseId,headSha,status,conclusion,event,createdAt,url 2>/tmp/probe_error.log)" || true
          if [ -s /tmp/probe_error.log ]; then
            PROBE_ERROR="$(tr '\n' ' ' < /tmp/probe_error.log | head -c 1000)"
          fi
          FOUND="$(printf '%s' "$RAW" | jq -c --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)] | first // empty')"
          if [ -z "$FOUND" ]; then
            FOUND='{"status":"not_found","conclusion":null,"databaseId":null,"url":null}'
          fi
          RUN_DB_ID="$(printf '%s' "$FOUND" | jq -r '.databaseId // empty')"
          DIAGNOSTIC="output/run_manifests/etf_eu_routine_run_probe_${TARGET_RUN_IDENTITY}.log"
          if [ -n "$RUN_DB_ID" ]; then
            gh run view "$RUN_DB_ID" --repo "$GITHUB_REPOSITORY" --json jobs,status,conclusion,url > /tmp/run_detail.json 2>/tmp/view_error.log || printf '%s\n' '{"jobs":[],"status":"view_failed","conclusion":null,"url":null}' > /tmp/run_detail.json
            gh run view "$RUN_DB_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
            tail -n 240 /tmp/failed.log > "$DIAGNOSTIC"
          else
            printf '%s\n' '{"jobs":[],"status":"not_found","conclusion":null,"url":null}' > /tmp/run_detail.json
            printf '%s\n' 'TARGET_RUN_NOT_FOUND' > "$DIAGNOSTIC"
          fi
          jq -n --argjson summary "$FOUND" --slurpfile detail /tmp/run_detail.json \
            --arg identity "$TARGET_RUN_IDENTITY" --arg sha "$TARGET_SHA" --arg workflow "$TARGET_WORKFLOW" --arg probe_error "$PROBE_ERROR" --arg diagnostic "$DIAGNOSTIC" \
            '{schema_version:"etf_eu_routine_run_probe_v2",artifact_type:"etf_eu_routine_run_probe",target_run_identity:$identity,target_head_sha:$sha,workflow_file:$workflow,run_id:$summary.databaseId,status:$summary.status,conclusion:$summary.conclusion,url:$summary.url,jobs:($detail[0].jobs // []),probe_error:$probe_error,diagnostic_log:$diagnostic,external_transport:false}' \
            > "output/run_manifests/etf_eu_routine_run_probe_${TARGET_RUN_IDENTITY}.json"
      - name: Persist run probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "output/run_manifests/etf_eu_routine_run_probe_${TARGET_RUN_IDENTITY}.json" "output/run_manifests/etf_eu_routine_run_probe_${TARGET_RUN_IDENTITY}.log"
          git commit -m "Persist ETF EU routine run probe ${TARGET_RUN_IDENTITY} diagnostics [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin HEAD:main
