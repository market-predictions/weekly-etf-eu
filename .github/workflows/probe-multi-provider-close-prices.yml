name: Probe multi-provider ETF EU close prices

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Completed-close cutoff date
        required: true
        default: "2026-07-31"
  pull_request:
    paths:
      - "pricing/provider_close_price_engine.py"
      - "pricing/build_multi_provider_close_price_results.py"
      - "config/ucits_close_price_validation_basket.yml"
      - "tests/test_provider_close_price_engine.py"
      - ".github/workflows/probe-multi-provider-close-prices.yml"

permissions:
  contents: read

jobs:
  qualify-close-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded dependencies
        run: python -m pip install requests==2.32.3 PyYAML==6.0.2 pytest==8.3.5

      - name: Run provider parser tests
        run: pytest -q tests/test_provider_close_price_engine.py

      - name: Qualify exact ETF trading lines
        env:
          LEEWAY_API_TOKEN: ${{ secrets.LEEWAY_API_TOKEN }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          set -euo pipefail
          REPORT_DATE="${{ github.event.inputs.report_date || '2026-07-31' }}"
          mkdir -p output/provider_qualification
          python pricing/build_multi_provider_close_price_results.py \
            --basket config/ucits_close_price_validation_basket.yml \
            --report-date "$REPORT_DATE" \
            --output "output/provider_qualification/multi_provider_close_prices_${REPORT_DATE}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.json"

      - name: Upload provider qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: multi-provider-close-prices-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/provider_qualification/*.json
          if-no-files-found: error
          retention-days: 30
