name: Probe official Xetra sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pricing/probe_official_xetra_sources.py"
      - ".github/workflows/probe-official-xetra-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Probe public Xetra sources
        run: |
          mkdir -p output/allocator_shadow
          python pricing/probe_official_xetra_sources.py \
            --output output/allocator_shadow/official_xetra_source_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-xetra-source-probe
          path: output/allocator_shadow/official_xetra_source_probe.json
          if-no-files-found: error
