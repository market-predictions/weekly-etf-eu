name: Probe Stooq connectivity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pricing/ucits_close_price_multi_source_v2.py"
      - "pricing/build_ucits_close_price_validation_basket_results.py"
      - "tools/probe_stooq_connectivity.py"
      - ".github/workflows/probe-stooq-connectivity.yml"

permissions:
  contents: read

jobs:
  probe-stooq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install requests==2.32.3

      - name: Probe Stooq without logging the secret
        env:
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: |
          set -euo pipefail
          python tools/probe_stooq_connectivity.py \
            --report-date 2026-07-31 \
            --output output/stooq_probe/stooq_connectivity_probe.json

      - name: Upload Stooq probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: stooq-connectivity-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/stooq_probe/stooq_connectivity_probe.json
          if-no-files-found: error
          retention-days: 30
