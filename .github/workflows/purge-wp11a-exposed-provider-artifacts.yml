name: Purge WP11A exposed provider artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/purge-wp11a-exposed-provider-artifacts.yml"

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete pre-redaction pricing artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactIds = [
              8864532871,
              8864789101,
              8864802183,
              8864801025,
              8864692562,
              8864703308,
              8864712816,
              8864721834,
              8864743597,
              8864965040,
              8864974459,
              8864989704,
              8864995182,
              8865017091,
            ];
            const results = [];
            for (const artifact_id of artifactIds) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id,
                });
                results.push({artifact_id, status: "deleted"});
              } catch (error) {
                if (error.status === 404) {
                  results.push({artifact_id, status: "already_absent"});
                  continue;
                }
                throw error;
              }
            }
            core.info(JSON.stringify({purged: results}, null, 2));
