name: Weekly ETF EU candidate build

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "Prepared Weekly ETF EU candidate request path"
        required: true

permissions:
  contents: write

jobs:
  candidate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Require non-main candidate branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ETF_EU_CANDIDATE_BUILD_REFUSES_MAIN" >&2
            exit 1
          fi
          echo "ETF_EU_CANDIDATE_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check out donor research repository
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: main
          fetch-depth: 1
          path: _donor_weekly_etf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install candidate dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libcairo2 libpango-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info fonts-liberation fonts-dejavu-core fonts-lato poppler-utils
          python -m pip install --upgrade pip
          pip install pyyaml yfinance weasyprint matplotlib==3.9.2

      - name: Resolve and validate candidate request
        env:
          ETF_EU_REQUEST_PATH: ${{ inputs.request_path }}
        run: |
          set -euo pipefail
          python tools/validate_etf_eu_routine_report_request.py --request "$ETF_EU_REQUEST_PATH"
          python - "$ETF_EU_REQUEST_PATH" <<'PY'
          import sys
          from pathlib import Path
          from tools.validate_etf_eu_routine_report_request import validate
          data = validate(Path(sys.argv[1]))
          mapping = {
              "ETF_EU_REQUEST_PATH": sys.argv[1],
              "ETF_EU_RUN_ID": data["run_id"],
              "ETF_EU_REPORT_DATE": data["report_date"],
              "ETF_EU_REPORT_SUFFIX": data["report_suffix"],
              "ETF_EU_PREVIOUS_ROUTINE_MANIFEST": data["previous_routine_manifest"],
              "ETF_EU_PREVIOUS_CLOSEOUT": data["previous_delivery_closeout_manifest"],
          }
          with Path("env.out").open("w", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  handle.write(f"{key}={value}\n")
          PY
          cat env.out >> "$GITHUB_ENV"

      - name: Select current donor breadth evidence
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="output/evidence/${ETF_EU_RUN_ID}"
          mkdir -p "$EVIDENCE_ROOT"
          SELECTED=$(python tools/select_weekly_etf_donor_lane_artifact.py --donor-root _donor_weekly_etf --report-date "$ETF_EU_REPORT_DATE")
          DONOR_SHA=$(git -C _donor_weekly_etf rev-parse HEAD)
          DONOR_COPY="$EVIDENCE_ROOT/donor_lane_source.json"
          DONOR_PROVENANCE="$EVIDENCE_ROOT/donor_lane_provenance.json"
          cp "$SELECTED" "$DONOR_COPY"
          python - "$SELECTED" "$DONOR_COPY" "$DONOR_PROVENANCE" "$DONOR_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          source, copied, provenance, sha = sys.argv[1:]
          payload = json.loads(Path(copied).read_text(encoding="utf-8"))
          Path(provenance).write_text(json.dumps({
              "schema_version": "etf_eu_donor_lane_provenance_v1",
              "source_repository": "market-predictions/weekly-etf",
              "source_commit_sha": sha,
              "source_path": source.replace("_donor_weekly_etf/", ""),
              "copied_candidate_path": copied,
              "source_report_date": payload.get("report_date"),
              "discovery_engine_version": payload.get("discovery_engine_version"),
              "funding_authority": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "ETF_EU_DONOR_LANE_ARTIFACT=$DONOR_COPY" >> "$GITHUB_ENV"
          echo "ETF_EU_DONOR_LANE_PROVENANCE=$DONOR_PROVENANCE" >> "$GITHUB_ENV"

      - name: Select quota-aware pricing candidates
        run: |
          set -euo pipefail
          SELECTION="output/evidence/${ETF_EU_RUN_ID}/allocation_pricing_candidates.json"
          python tools/select_etf_eu_allocation_pricing_candidates.py \
            --donor-lane-artifact "$ETF_EU_DONOR_LANE_ARTIFACT" \
            --proxy-map config/ucits_benchmark_proxy_map.yml \
            --provider-registry config/ucits_price_provider_registry.yml \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --max-candidates 4 \
            --output "$SELECTION"
          CANDIDATES=$(python - "$SELECTION" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(",".join(payload.get("selected_basket_ids") or []))
          PY
          )
          echo "ETF_EU_ALLOCATION_PRICING_SELECTION=$SELECTION" >> "$GITHUB_ENV"
          echo "ETF_EU_ALLOCATION_PRICING_CANDIDATES=$CANDIDATES" >> "$GITHUB_ENV"

      - name: Validate routine implementation preflight
        run: |
          set -euo pipefail
          python -m tools.validate_etf_eu_routine_preflight --request "$ETF_EU_REQUEST_PATH"

      - name: Build current UCITS pricing evidence
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: |
          set -euo pipefail
          python pricing/build_ucits_close_price_validation_basket_results.py \
            --run-id "$ETF_EU_RUN_ID" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --providers alpha_vantage,yahoo_chart \
            --allocation-candidate-basket-ids "$ETF_EU_ALLOCATION_PRICING_CANDIDATES" \
            --require-funded-exact-close-authority \
            --pause-seconds 8 \
            --rate-limit-cooldown-seconds 600 \
            --max-attempts 2 \
            --rate-limit-mode stop
          python tools/validate_ucits_close_price_validation_basket_results.py \
            --artifact "output/pricing/ucits_close_price_validation_basket_results_${ETF_EU_RUN_ID}.json" \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --expected-report-date "$ETF_EU_REPORT_DATE"

      - name: Refresh current macro evidence
        run: |
          set -euo pipefail
          MACRO_ARTIFACT="output/evidence/${ETF_EU_RUN_ID}/macro_policy_pack.json"
          python -m runtime.adapt_weekly_etf_macro_for_eu \
            --source-url "https://raw.githubusercontent.com/market-predictions/weekly-etf/main/output/macro/latest.json" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --run-id "$ETF_EU_RUN_ID" \
            --output "$MACRO_ARTIFACT"
          echo "ETF_EU_MACRO_ARTIFACT=$MACRO_ARTIFACT" >> "$GITHUB_ENV"

      - name: Build frozen Thin Current Kernel package
        run: |
          set -euo pipefail
          python -m tools.build_etf_eu_thin_kernel_package \
            --run-id "$ETF_EU_RUN_ID" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --report-suffix "$ETF_EU_REPORT_SUFFIX" \
            --pricing-artifact "output/pricing/ucits_close_price_validation_basket_results_${ETF_EU_RUN_ID}.json" \
            --macro-pack "$ETF_EU_MACRO_ARTIFACT" \
            --donor-lane-artifact "$ETF_EU_DONOR_LANE_ARTIFACT" \
            --previous-routine-manifest "$ETF_EU_PREVIOUS_ROUTINE_MANIFEST" \
            --previous-delivery-closeout-manifest "$ETF_EU_PREVIOUS_CLOSEOUT"

      - name: Validate frozen semantic and client-surface contract
        run: |
          set -euo pipefail
          VALIDATION="output/evidence/${ETF_EU_RUN_ID}/thin_kernel_validation.json"
          SAFETY="output/evidence/${ETF_EU_RUN_ID}/client_surface_safety.json"
          python -m tools.validate_etf_eu_thin_kernel --output "$VALIDATION"
          python tools/validate_etf_eu_client_surface_safety.py \
            --manifest output/current/manifest.json \
            --proxy-map config/ucits_benchmark_proxy_map.yml \
            --output "$SAFETY"
          python tools/validate_etf_eu_product_boundary.py

      - name: Render complete PDF review pages
        run: |
          set -euo pipefail
          REVIEW_ROOT="output/evidence/${ETF_EU_RUN_ID}/review_pages"
          mkdir -p "$REVIEW_ROOT/nl" "$REVIEW_ROOT/en"
          python tools/render_etf_eu_pdf_review_pages.py --pdf output/current/report_nl.pdf --output-dir "$REVIEW_ROOT/nl" --write-index "$REVIEW_ROOT/nl/index.json"
          python tools/render_etf_eu_pdf_review_pages.py --pdf output/current/report_en.pdf --output-dir "$REVIEW_ROOT/en" --write-index "$REVIEW_ROOT/en/index.json"

      - name: Persist frozen candidate evidence to candidate branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            "output/pricing/ucits_close_price_validation_basket_results_${ETF_EU_RUN_ID}.json" \
            "output/pricing/ucits_price_provider_qualification_${ETF_EU_RUN_ID}.json" \
            "output/pricing/ucits_price_provider_registry_resolved_${ETF_EU_RUN_ID}.yml" \
            output/etf_eu_accountability_history.csv \
            output/etf_eu_recommendation_scorecard.csv \
            output/current \
            "output/evidence/${ETF_EU_RUN_ID}" \
            "output/history/${ETF_EU_REPORT_DATE}/${ETF_EU_RUN_ID}"
          if git diff --cached --quiet; then
            echo "ETF_EU_CANDIDATE_OUTPUTS_UNCHANGED"
          else
            git commit -m "Persist ETF EU thin-kernel candidate ${ETF_EU_RUN_ID} [skip ci]"
            git push origin "HEAD:${ETF_EU_CANDIDATE_BRANCH}"
          fi
          echo "ETF_EU_CANDIDATE_ONLY=PASS"
          echo "ETF_EU_INDEPENDENT_ASSURANCE_REQUIRED=true"
          echo "ETF_EU_DELIVERY_AUTHORITY=false"

      - name: Upload frozen candidate review bundle
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-candidate-${{ env.ETF_EU_RUN_ID }}
          path: |
            output/current/
            output/evidence/${{ env.ETF_EU_RUN_ID }}/
            output/history/${{ env.ETF_EU_REPORT_DATE }}/${{ env.ETF_EU_RUN_ID }}/
          if-no-files-found: error
