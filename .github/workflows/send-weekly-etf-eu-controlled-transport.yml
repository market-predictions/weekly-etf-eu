name: Weekly ETF EU controlled transport

on:
  workflow_dispatch:
    inputs:
      delivery_authority_path:
        description: "Committed guarded-delivery authority JSON for the independently assured report"
        required: true
        type: string
      delivery_mode:
        description: "Must be send"
        required: true
        default: "validate_only"
        type: choice
        options:
          - validate_only
          - send
      send_confirmation:
        description: "First explicit controlled-send confirmation"
        required: true
        default: "not_confirmed"
        type: choice
        options:
          - not_confirmed
          - confirm_guarded_send
      second_confirmation:
        description: "Second explicit controlled-send confirmation"
        required: true
        default: "not_confirmed"
        type: choice
        options:
          - not_confirmed
          - confirm_guarded_send_second

permissions:
  contents: write

jobs:
  controlled-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Require main delivery surface
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "ETF_EU_CONTROLLED_TRANSPORT_REQUIRES_MAIN" >&2
            exit 1
          fi

      - name: Check out exact main state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate explicit transport confirmations
        run: |
          set -euo pipefail
          if [ "${{ inputs.delivery_mode }}" != "send" ]; then
            echo "ETF_EU_CONTROLLED_TRANSPORT_MODE_NOT_SEND" >&2
            exit 1
          fi
          if [ "${{ inputs.send_confirmation }}" != "confirm_guarded_send" ]; then
            echo "ETF_EU_CONTROLLED_TRANSPORT_CONFIRMATION_MISSING" >&2
            exit 1
          fi
          if [ "${{ inputs.second_confirmation }}" != "confirm_guarded_send_second" ]; then
            echo "ETF_EU_CONTROLLED_TRANSPORT_SECOND_CONFIRMATION_MISSING" >&2
            exit 1
          fi

      - name: Validate independently assured guarded-delivery authority
        env:
          ETF_EU_DELIVERY_AUTHORITY: ${{ inputs.delivery_authority_path }}
        run: |
          set -euo pipefail
          RUN_ID="$(date -u +'%Y%m%d_%H%M%S')"
          PACKAGE_MANIFEST="output/delivery_package/etf_eu_delivery_package_manifest_${RUN_ID}.json"
          python tools/validate_etf_eu_guarded_delivery_git_binding.py \
            --authority "$ETF_EU_DELIVERY_AUTHORITY"
          python tools/validate_etf_eu_guarded_delivery_authority.py \
            --authority "$ETF_EU_DELIVERY_AUTHORITY" \
            --transport-run-id "$RUN_ID" \
            --write-package-manifest "$PACKAGE_MANIFEST"
          python - "$ETF_EU_DELIVERY_AUTHORITY" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifacts = payload["artifacts"]
          mapping = {
              "ETF_EU_RUN_ID": None,
              "ETF_EU_REPORT_RUN_ID": payload["report_run_id"],
              "ETF_EU_REPORT_DATE": payload["report_date"],
              "ETF_EU_REPORT_SUFFIX": payload["report_suffix"],
              "ETF_EU_APPROVED_REPORT_COMMIT": payload["approved_report_commit_sha"],
              "ETF_EU_ASSURED_CANDIDATE_HEAD": payload["assured_candidate_head_sha"],
              "ETF_EU_NL_MD": artifacts["nl_md"]["path"],
              "ETF_EU_EN_MD": artifacts["en_md"]["path"],
          }
          with Path("authority.env").open("w", encoding="utf-8") as handle:
              for key, value in mapping.items():
                  if value is not None:
                      handle.write(f"{key}={value}\n")
          PY
          echo "ETF_EU_RUN_ID=$RUN_ID" >> authority.env
          echo "ETF_EU_DELIVERY_PACKAGE_MANIFEST=$PACKAGE_MANIFEST" >> authority.env
          cat authority.env >> "$GITHUB_ENV"

      - name: Verify approved commit is in current main lineage
        run: |
          set -euo pipefail
          git cat-file -e "${ETF_EU_APPROVED_REPORT_COMMIT}^{commit}"
          if ! git merge-base --is-ancestor "$ETF_EU_APPROVED_REPORT_COMMIT" HEAD; then
            echo "ETF_EU_APPROVED_REPORT_COMMIT_NOT_IN_MAIN_LINEAGE" >&2
            exit 1
          fi
          python tools/validate_etf_eu_guarded_delivery_authority.py \
            --authority "${{ inputs.delivery_authority_path }}"
          echo "ETF_EU_ASSURED_DELIVERY_BINDING_OK"

      - name: Validate assured delivery package manifest
        run: |
          set -euo pipefail
          python tools/validate_etf_eu_delivery_package_manifest.py \
            --manifest "$ETF_EU_DELIVERY_PACKAGE_MANIFEST"

      - name: Build controlled pre-transport evidence
        run: |
          set -euo pipefail
          python -m runtime.write_etf_eu_delivery_evidence \
            --controlled \
            --stage pre \
            --run-id "$ETF_EU_RUN_ID" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --report-suffix "$ETF_EU_REPORT_SUFFIX" \
            --nl-md "$ETF_EU_NL_MD" \
            --en-md "$ETF_EU_EN_MD" \
            --delivery-package-manifest "$ETF_EU_DELIVERY_PACKAGE_MANIFEST" \
            --output-dir output/delivery

      - name: Execute exact assured EU transport entrypoint
        env:
          ETF_EU_TRANSPORT_HOST: ${{ secrets.MRKT_RPRTS_SMTP_HOST }}
          ETF_EU_TRANSPORT_PORT: ${{ secrets.MRKT_RPRTS_SMTP_PORT }}
          ETF_EU_TRANSPORT_USER: ${{ secrets.MRKT_RPRTS_SMTP_USER }}
          ETF_EU_TRANSPORT_AUTH: ${{ secrets.MRKT_RPRTS_SMTP_PASS }}
          ETF_EU_FROM_ADDRESS: ${{ secrets.MRKT_RPRTS_MAIL_FROM }}
          ETF_EU_TO_NL: ${{ secrets.MRKT_RPRTS_MAIL_TO }}
          ETF_EU_TO_EN: ${{ secrets.MRKT_RPRTS_MAIL_TO }}
        run: |
          set -euo pipefail
          python -m runtime.send_etf_eu_controlled_report \
            --confirm-controlled-send \
            --run-id "$ETF_EU_RUN_ID" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --report-suffix "$ETF_EU_REPORT_SUFFIX" \
            --nl-md "$ETF_EU_NL_MD" \
            --en-md "$ETF_EU_EN_MD" \
            --require-pdf-package \
            --delivery-package-manifest "$ETF_EU_DELIVERY_PACKAGE_MANIFEST" \
            --output-dir output/delivery

      - name: Build controlled post-transport evidence
        run: |
          set -euo pipefail
          python -m runtime.write_etf_eu_delivery_evidence \
            --controlled \
            --stage post \
            --run-id "$ETF_EU_RUN_ID" \
            --report-date "$ETF_EU_REPORT_DATE" \
            --report-suffix "$ETF_EU_REPORT_SUFFIX" \
            --nl-md "$ETF_EU_NL_MD" \
            --en-md "$ETF_EU_EN_MD" \
            --delivery-package-manifest "$ETF_EU_DELIVERY_PACKAGE_MANIFEST" \
            --transport-result-path "output/delivery/etf_eu_transport_result_${ETF_EU_RUN_ID}.json" \
            --output-dir output/delivery

      - name: Build delayed receipt-check artifact
        run: |
          set -euo pipefail
          python -m runtime.check_etf_eu_delivery_receipt \
            --run-id "$ETF_EU_RUN_ID" \
            --evidence-path "output/delivery/etf_eu_delivery_evidence_${ETF_EU_RUN_ID}.json" \
            --delay-minutes 10 \
            --output-dir output/delivery

      - name: Persist controlled transport evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/delivery/etf_eu_delivery_evidence_*.json \
            output/delivery/etf_eu_transport_result_*.json \
            output/delivery/etf_eu_receipt_check_*.json \
            "$ETF_EU_DELIVERY_PACKAGE_MANIFEST" || true
          if git diff --cached --quiet; then
            echo "ETF_EU_NO_TRANSPORT_EVIDENCE_TO_COMMIT"
          else
            git commit -m "Persist ETF EU controlled transport evidence [skip ci]"
            git push origin HEAD:main
          fi
