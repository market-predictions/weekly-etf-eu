name: Snapshot ETF EU fresh 260817 R2 run once

on:
  push:
    branches:
      - ops/dispatch-etf-eu-260818-once
    paths:
      - .github/workflows/snapshot-etf-eu-260817-r2-run-once.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Persist current canonical R2 run snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,json,os,urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          url=f'https://api.github.com/repos/{repo}/actions/workflows/run-weekly-etf-eu-routine.yml/runs?branch=agent/etf-eu-fresh-260817-v2&event=workflow_dispatch&per_page=10'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: data=json.loads(r.read().decode())
          out={'total_count':data.get('total_count'),'runs':[{k:x.get(k) for k in ['id','name','status','conclusion','html_url','head_sha','created_at','updated_at','run_attempt']} for x in data.get('workflow_runs',[])]}
          raw=(json.dumps(out,indent=2)+'\n').encode(); path='ops/evidence/ETF_EU_FRESH_260817_R2_SNAPSHOT.json'
          payload={'message':'Persist ETF EU 260817 R2 run snapshot','content':base64.b64encode(raw).decode(),'branch':'ops/dispatch-etf-eu-260818-once'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print(r.read().decode())
          print(json.dumps(out,indent=2))
          PY
