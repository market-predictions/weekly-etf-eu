name: ETF EU email equity parity

on:
  pull_request:
    paths:
      - "runtime/send_etf_eu_controlled_report.py"
      - ".github/workflows/send-weekly-etf-eu-controlled-transport.yml"
      - "tests/test_etf_eu_email_equity_parity.py"
      - ".github/workflows/test-etf-eu-email-equity-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-equity-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned rasterizer
        run: python -m pip install --disable-pip-version-check CairoSVG==2.7.1
      - name: Run MIME parity regression tests
        run: python -m unittest discover -s tests -p 'test_etf_eu_email_equity_parity.py' -v
