name: ETF EU email equity parity

on:
  pull_request:
    paths:
      - "runtime/equity_curve_png_contract.py"
      - "runtime/standalone_html_equity_embed.py"
      - "runtime/finalize_etf_eu_client_surface_semantics.py"
      - "runtime/equity_curve_eu_contract.py"
      - "runtime/send_etf_eu_controlled_report.py"
      - ".github/workflows/send-weekly-etf-eu-controlled-transport.yml"
      - "tests/test_etf_eu_email_equity_parity.py"
      - ".github/workflows/test-etf-eu-email-equity-parity.yml"
      - "control/work_packages/ETF_EU_EMAIL_EQUITY_PARITY_105_20260818.md"
      - "handover/HANDOVER_ETF_EU_EMAIL_EQUITY_PARITY_105_20260818.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-equity-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned donor chart dependency
        run: python -m pip install --disable-pip-version-check matplotlib==3.9.2
      - name: Run standalone and MIME parity regression tests
        run: python -m unittest discover -s tests -p 'test_etf_eu_email_equity_parity.py' -v
