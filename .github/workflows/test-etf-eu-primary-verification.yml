name: Test ETF EU primary verification pricing

on:
  push:
    branches:
      - agent/etf-eu-primary-verification-111
    paths:
      - control/work_packages/ETF_EU_PRIMARY_VERIFICATION_111_20260818.md
      - pricing/ucits_provider_identity_binding.py
      - pricing/ucits_price_qualification_policy.py
      - pricing/ucits_primary_verification_legacy.py
      - pricing/build_ucits_close_price_validation_basket_results.py
      - pricing/ucits_close_price_validation_contract_v2.py
      - tools/validate_ucits_close_price_validation_basket_results.py
      - tests/test_etf_eu_primary_verification_policy.py
      - tests/test_etf_eu_primary_verification_contract.py
      - tests/test_etf_eu_current_identity_binding.py
      - tests/test_etf_eu_260817_pricing_regression.py
      - tests/test_ucits_price_qualification_policy.py
      - tests/test_ucits_price_evidence_redaction.py
      - .github/workflows/test-etf-eu-primary-verification.yml
  pull_request:
    paths:
      - control/work_packages/ETF_EU_PRIMARY_VERIFICATION_111_20260818.md
      - pricing/ucits_provider_identity_binding.py
      - pricing/ucits_price_qualification_policy.py
      - pricing/ucits_primary_verification_legacy.py
      - pricing/build_ucits_close_price_validation_basket_results.py
      - pricing/ucits_close_price_validation_contract_v2.py
      - tools/validate_ucits_close_price_validation_basket_results.py
      - tests/test_etf_eu_primary_verification_policy.py
      - tests/test_etf_eu_primary_verification_contract.py
      - tests/test_etf_eu_current_identity_binding.py
      - tests/test_etf_eu_260817_pricing_regression.py
      - tests/test_ucits_price_qualification_policy.py
      - tests/test_ucits_price_evidence_redaction.py
      - .github/workflows/test-etf-eu-primary-verification.yml

permissions:
  contents: read

jobs:
  primary-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pyyaml requests
      - name: Run primary verification policy, identity, contract and incident regression tests
        run: |
          python -m unittest \
            tests.test_etf_eu_primary_verification_policy \
            tests.test_etf_eu_primary_verification_contract \
            tests.test_etf_eu_current_identity_binding \
            tests.test_etf_eu_260817_pricing_regression \
            tests.test_ucits_price_qualification_policy \
            tests.test_ucits_price_evidence_redaction \
            -v
      - name: Compile touched pricing modules
        run: |
          python -m py_compile \
            pricing/ucits_provider_identity_binding.py \
            pricing/ucits_price_qualification_policy.py \
            pricing/ucits_primary_verification_legacy.py \
            pricing/build_ucits_close_price_validation_basket_results.py \
            pricing/ucits_close_price_validation_contract_v2.py \
            tools/validate_ucits_close_price_validation_basket_results.py
