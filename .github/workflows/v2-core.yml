name: v2 core (development)

# Development runner for the v2 rebuild. Runs the task named in v2/ci_task.txt
# and commits generated evidence/state back to the v2-core branch.
on:
  push:
    branches: [v2-core]
    paths: ["v2/**", ".github/workflows/v2-core.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-core
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install requests==2.32.3 PyYAML==6.0.2
      - name: Run task
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: |
          set -euo pipefail
          TASK=$(tr -d '[:space:]' < v2/ci_task.txt)
          echo "TASK=$TASK"
          python -m "v2.$TASK"
      - name: Commit results back
        run: |
          set -euo pipefail
          git config user.name "v2-core-bot"
          git config user.email "v2-core-bot@users.noreply.github.com"
          git add v2/evidence v2/state 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "v2: results of $(tr -d '[:space:]' < v2/ci_task.txt) [skip ci]"
          git push origin HEAD:v2-core
