name: Validate ETF EU current kernel

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Compile current production kernel and validators
        run: |
          set -euo pipefail
          python -m compileall -q runtime/current
          python -m py_compile \
            tools/build_etf_eu_thin_kernel_package.py \
            tools/validate_etf_eu_thin_kernel.py \
            tools/validate_etf_eu_current_reachability.py \
            tools/validate_etf_eu_repository_boundary.py \
            tools/validate_etf_eu_workflow_authority.py

      - name: Run current-kernel regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_etf_eu_thin_current_kernel.py \
            tests/test_etf_eu_current_kernel_boundaries.py \
            tests/test_etf_eu_260817_pricing_regression.py \
            tests/test_validate_etf_eu_repository_boundary.py

      - name: Enforce product and execution boundaries
        run: |
          set -euo pipefail
          python tools/validate_etf_eu_product_boundary.py
          python tools/validate_etf_eu_repository_boundary.py
          python tools/validate_etf_eu_workflow_authority.py
          python tools/validate_etf_eu_current_reachability.py
