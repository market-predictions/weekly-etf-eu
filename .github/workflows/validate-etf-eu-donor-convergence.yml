name: Validate ETF EU donor convergence

on:
  pull_request:
    paths:
      - "control/**"
      - "config/etf_eu_transition_policy_v1.yml"
      - "config/etf_eu_discovery_universe.yml"
      - "runtime/build_etf_eu_production_convergence_state_v3.py"
      - "runtime/build_etf_eu_current_reunderwriting_scorecard.py"
      - "runtime/synchronize_etf_eu_current_state_surface_v2.py"
      - "runtime/adapt_weekly_etf_macro_for_eu.py"
      - "tools/audit_etf_eu_donor_parity.py"
      - "tools/validate_etf_eu_current_reunderwriting_scorecard.py"
      - "tests/test_etf_eu_donor_convergence.py"
      - ".github/workflows/run-weekly-etf-eu-routine.yml"
      - ".github/workflows/validate-etf-eu-donor-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  donor-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact ETF EU candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout mature Weekly ETF donor contracts
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          path: donor-weekly-etf
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded convergence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml beautifulsoup4 weasyprint

      - name: Compile convergence implementation
        run: |
          python -m py_compile \
            runtime/build_etf_eu_production_convergence_state_v3.py \
            runtime/build_etf_eu_current_reunderwriting_scorecard.py \
            runtime/synchronize_etf_eu_current_state_surface_v2.py \
            tools/audit_etf_eu_donor_parity.py \
            tools/validate_etf_eu_current_reunderwriting_scorecard.py

      - name: Run donor-convergence regression tests
        run: |
          python -m pytest -q tests/test_etf_eu_donor_convergence.py tests/test_etf_eu_current_state_surface_v2.py

      - name: Run five-layer donor parity audit
        run: |
          python tools/audit_etf_eu_donor_parity.py \
            --root . \
            --donor-root donor-weekly-etf \
            --output output/quality/etf_eu_donor_parity_audit.json

      - name: Build current funded re-underwriting memory proof
        run: |
          python runtime/build_etf_eu_current_reunderwriting_scorecard.py \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --report-date 2026-08-05 \
            --source-report donor-convergence-ci \
            --output output/quality/etf_eu_current_reunderwriting_scorecard_ci.csv
          python tools/validate_etf_eu_current_reunderwriting_scorecard.py \
            --scorecard output/quality/etf_eu_current_reunderwriting_scorecard_ci.csv \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --report-date 2026-08-05 \
            --output output/quality/etf_eu_current_reunderwriting_validation_ci.json

      - name: Prove no portfolio mutation in convergence gate
        run: |
          git diff --exit-code -- output/etf_eu_portfolio_state.json output/etf_eu_trade_ledger.csv

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-donor-convergence-${{ github.sha }}
          path: |
            output/quality/etf_eu_donor_parity_audit.json
            output/quality/etf_eu_current_reunderwriting_scorecard_ci.csv
            output/quality/etf_eu_current_reunderwriting_validation_ci.json
          if-no-files-found: warn
          retention-days: 90
