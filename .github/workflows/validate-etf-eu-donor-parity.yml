name: Validate ETF EU donor parity

on:
  pull_request:
  workflow_dispatch:

jobs:
  donor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-liberation fonts-dejavu-core fonts-lato
          pip install pytest pyyaml weasyprint requests mistune matplotlib==3.9.2
      - name: Compile parity and authority modules
        run: |
          python -m py_compile \
            pricing/ucits_close_price_validation_contract_v2.py \
            runtime/apply_etf_eu_donor_parity_contract.py \
            runtime/build_etf_eu_client_grade_report_state_v2.py \
            runtime/build_etf_eu_donor_discovery_bridge.py \
            runtime/adapt_weekly_etf_macro_for_eu.py \
            runtime/reconcile_etf_eu_funded_markdown.py \
            runtime/equity_curve_png_contract.py \
            runtime/standalone_html_equity_embed.py \
            runtime/finalize_etf_eu_client_surface_semantics.py \
            runtime/render_etf_eu_client_grade_v2_funded.py \
            runtime/send_etf_eu_controlled_report.py \
            tools/resolve_etf_eu_completed_close_date.py \
            tools/select_weekly_etf_donor_lane_artifact.py \
            tools/build_etf_eu_routine_report_package.py \
            tools/build_etf_eu_routine_report_package_v2.py \
            tools/validate_ucits_close_price_validation_basket_results.py \
            tools/validate_etf_eu_markdown_delivery_artifacts.py \
            tools/validate_etf_eu_routine_report_request.py \
            tools/validate_etf_eu_guarded_delivery_authority.py \
            tools/validate_etf_eu_workflow_authority.py
      - name: Run donor-parity, blocker and full-package regressions
        run: |
          python -m pytest -q \
            tests/test_etf_eu_donor_parity_contract.py \
            tests/test_etf_eu_donor_discovery_bridge.py \
            tests/test_resolve_etf_eu_completed_close_date.py \
            tests/test_etf_eu_guarded_delivery_authority.py \
            tests/test_etf_eu_routine_request_authority.py \
            tests/test_etf_eu_funded_renderer_authority.py \
            tests/test_etf_eu_pricing_v2_and_markdown_delivery.py \
            tests/test_etf_eu_candidate_build_end_to_end.py \
            tests/test_etf_eu_full_candidate_package_end_to_end.py \
            tests/test_etf_eu_email_equity_parity.py
      - name: Validate workflow authority topology
        run: |
          python tools/validate_etf_eu_workflow_authority.py
      - name: Static candidate pricing wiring audit
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/run-weekly-etf-eu-routine.yml').read_text(encoding='utf-8')
          required = [
              '--report-date "$ETF_EU_REPORT_DATE"',
              '--require-funded-consensus',
              '--expected-report-date "$ETF_EU_REPORT_DATE"',
              'validate_etf_eu_markdown_delivery_artifacts',
              'etf_eu_markdown_delivery_validation_${ETF_EU_RUN_ID}.json',
          ]
          for token in required:
              assert token in workflow, token
          package = Path('tools/build_etf_eu_routine_report_package_v2.py').read_text(encoding='utf-8')
          assert 'build_etf_eu_client_grade_report_state_v2 import build_state' in package
          legacy_helper = Path('tools/build_etf_eu_routine_report_package.py').read_text(encoding='utf-8')
          assert 'validate_v2_pricing' in legacy_helper
          assert 'min_threshold_met' not in legacy_helper
          print('ETF_EU_CANDIDATE_PRICING_AND_MARKDOWN_WIRING=PASS')
          PY
      - name: Static allocation authority leak audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          authority = Path('control/ETF_EU_ALLOCATION_AUTHORITY_V1.md').read_text(encoding='utf-8')
          runbook = Path('control/ETF_EU_ROUTINE_WEEKLY_PRODUCTION_RUNBOOK_V1.md').read_text(encoding='utf-8')
          transition = yaml.safe_load(Path('config/etf_eu_transition_policy_v1.yml').read_text(encoding='utf-8'))
          target = yaml.safe_load(Path('config/etf_eu_target_allocation.yml').read_text(encoding='utf-8'))
          assert 'broker_specific_permission_required_for_model=false' in authority
          assert 'broker_permission_required_for_real_execution=true' in authority
          assert '~40% effective factor exposure = CONCENTRATION_DISCLOSURE_TRIGGER' in authority
          assert 'there is no universal current ETF EU cash floor' in runbook
          assert 'Transition allocator, CAP01 first-tranche activation' in runbook
          assert transition['authority_status'] == 'HISTORICAL_NON_EXECUTABLE'
          assert transition['canonical_for_current_allocation'] is False
          assert transition['funding_authority'] is False
          assert target['authority_status'] == 'HISTORICAL_NON_EXECUTABLE'
          assert target['canonical_for_current_allocation'] is False
          assert target['activation']['broker_specific_permission_required_for_model'] is False
          print('ETF_EU_DONOR_PARITY_STATIC_AUTHORITY_AUDIT=PASS')
          PY
