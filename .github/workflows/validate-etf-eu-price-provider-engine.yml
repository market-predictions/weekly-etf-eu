name: Validate ETF EU multi-provider close-price engine

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: Completed-close date to qualify
        required: false
        default: "2026-08-05"
  pull_request:
    paths:
      - "config/ucits_price_provider_registry.yml"
      - "config/ucits_close_price_validation_basket.yml"
      - "config/etf_eu_provider_close_cache_*.json"
      - "config/alpha_vantage_key_rotation_confirmed.json"
      - "output/etf_eu_portfolio_state.json"
      - "pricing/provider_secret_safety.py"
      - "pricing/alpha_vantage_capacity_policy.py"
      - "pricing/ucits_funded_universe.py"
      - "pricing/ucits_price_provider_engine.py"
      - "pricing/ucits_price_evidence_cache.py"
      - "pricing/ucits_price_qualification_policy.py"
      - "pricing/build_ucits_close_price_validation_basket_results.py"
      - "runtime/build_etf_eu_routine_valuation_overlay.py"
      - "runtime/apply_etf_eu_routine_valuation_to_client_report.py"
      - "tools/qualify_ucits_price_providers.py"
      - "tests/test_provider_secret_safety.py"
      - "tests/test_alpha_vantage_capacity_policy.py"
      - "tests/test_ucits_funded_universe.py"
      - "tests/test_ucits_price_provider_engine.py"
      - "tests/test_ucits_price_evidence_cache.py"
      - "tests/test_ucits_price_evidence_redaction.py"
      - "tests/test_ucits_price_qualification_policy.py"
      - "tests/test_etf_eu_routine_valuation_overlay.py"
      - "tests/test_apply_etf_eu_routine_valuation_to_client_report.py"
      - "control/work_packages/WP_SYNC_11A_MULTI_PROVIDER_CLOSE_PRICE_ENGINE_20260803.md"
      - "control/work_packages/WP_SYNC_11A_OPERATIONALIZATION_20260808.md"
      - ".github/workflows/validate-etf-eu-price-provider-engine.yml"

permissions:
  contents: read

jobs:
  validate-price-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REPORT_DATE: ${{ inputs.report_date || '2026-08-05' }}
      LEEWAY_API_TOKEN: ${{ secrets.LEEWAY_API_TOKEN }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      MARKETSTACK_ACCESS_KEY: ${{ secrets.MARKETSTACK_ACCESS_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded dependencies
        run: python -m pip install requests==2.32.3 PyYAML==6.0.2 beautifulsoup4 weasyprint

      - name: Run deterministic adapter, capacity, secret-safety, funded-universe, cache, redaction, consensus, identity, valuation and client-surface tests
        run: |
          python -m unittest \
            tests/test_provider_secret_safety.py \
            tests/test_alpha_vantage_capacity_policy.py \
            tests/test_ucits_funded_universe.py \
            tests/test_ucits_price_provider_engine.py \
            tests/test_ucits_price_evidence_cache.py \
            tests/test_ucits_price_evidence_redaction.py \
            tests/test_ucits_price_qualification_policy.py \
            tests/test_etf_eu_routine_valuation_overlay.py \
            tests/test_apply_etf_eu_routine_valuation_to_client_report.py \
            -v

      - name: Qualify controlled trading-line universe with live providers
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p output/provider_qualification
          python tools/qualify_ucits_price_providers.py \
            --registry config/ucits_price_provider_registry.yml \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --provider-cache config/etf_eu_provider_close_cache_20260731.json \
            --report-date "$REPORT_DATE" \
            --output output/provider_qualification/ucits_price_provider_qualification.json \
            --verify-identity \
            --pause-seconds 1 \
            --max-close-age-days 7 \
            --agreement-tolerance-pct 1.0

      - name: Validate qualification artifact contract
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml

          path = Path("output/provider_qualification/ucits_price_provider_qualification.json")
          payload = json.loads(path.read_text())
          portfolio = json.loads(Path("output/etf_eu_portfolio_state.json").read_text())
          registry = yaml.safe_load(Path("config/ucits_price_provider_registry.yml").read_text()) or {}
          expected_line_count = len([
              row for row in registry.get("trading_lines", []) if isinstance(row, dict)
          ])
          expected_funded = [
              row for row in portfolio.get("positions", [])
              if isinstance(row, dict) and row.get("investability_status") == "funded_model_position"
          ]
          expected_funded_count = len(expected_funded)
          if payload["schema_version"] != "ucits_price_provider_qualification_v1":
              raise SystemExit("PRICE_ENGINE_SCHEMA_MISMATCH")
          if payload["line_count"] != expected_line_count or payload["funded_line_count"] != expected_funded_count:
              raise SystemExit(
                  f"PRICE_ENGINE_BASKET_SCOPE_MISMATCH:lines={payload['line_count']}:"
                  f"expected_lines={expected_line_count}:funded={payload['funded_line_count']}:"
                  f"expected_funded={expected_funded_count}"
              )
          authority = payload.get("funded_universe_authority") or {}
          if authority.get("funded_position_count") != expected_funded_count:
              raise SystemExit("PRICE_ENGINE_FUNDED_AUTHORITY_MISMATCH")
          if payload["production_or_redistribution_authority"] is not False:
              raise SystemExit("PRICE_ENGINE_AUTHORITY_ESCALATED")
          if payload.get("funded_identity_anchor_count") != expected_funded_count:
              raise SystemExit("PRICE_ENGINE_FUNDED_IDENTITY_ANCHOR_MISSING")
          if payload.get("secret_redaction_applied") is not True:
              raise SystemExit("PRICE_ENGINE_REDACTION_NOT_APPLIED")
          capacity = payload.get("alpha_vantage_capacity_policy") or {}
          if capacity.get("identity_search_calls") != 0:
              raise SystemExit("ALPHA_CAPACITY_IDENTITY_SEARCH_NOT_ZERO")
          if capacity.get("live_close_scope") != "authoritative_funded_positions_only":
              raise SystemExit("ALPHA_CAPACITY_SCOPE_MISMATCH")
          for line in payload["lines"]:
              if line.get("funded") and line.get("qualification_status") == "qualified_development_consensus":
                  if not line.get("identity_anchor_providers"):
                      raise SystemExit(f"PRICE_ENGINE_UNANCHORED_FUNDED_LINE:{line['ticker']}")

          def contains_exact_secret(node, secret):
              if isinstance(node, dict):
                  return any(contains_exact_secret(value, secret) for value in node.values())
              if isinstance(node, list):
                  return any(contains_exact_secret(value, secret) for value in node)
              return isinstance(node, str) and node == secret

          for name in ("LEEWAY_API_TOKEN", "EODHD_API_TOKEN", "MARKETSTACK_ACCESS_KEY", "ALPHA_VANTAGE_API_KEY"):
              value = os.environ.get(name, "")
              if value and contains_exact_secret(payload, value):
                  raise SystemExit(f"PRICE_ENGINE_SECRET_LEAK:{name}")
          print(
              "ETF_EU_PRICE_ENGINE_OK"
              f" | configured={payload['provider_configuration']}"
              f" | lines={payload['line_count']}"
              f" | funded_consensus={payload['funded_consensus_count']}/{payload['funded_line_count']}"
              f" | identity_anchors={payload['funded_identity_anchor_count']}/{payload['funded_line_count']}"
              f" | stale_registry_flags={authority.get('stale_registry_funded_flags_overridden', [])}"
              f" | cache_used={payload.get('provider_cache_used_count', 0)}"
              f" | report_gate={payload['report_pricing_gate_passed']}"
          )
          PY

      - name: Upload provider qualification evidence
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-eu-price-provider-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/provider_qualification/
          if-no-files-found: error
          retention-days: 90
