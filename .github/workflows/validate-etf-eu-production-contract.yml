name: Validate ETF EU production report contract

on:
  pull_request:
    paths:
      - "tools/validate_etf_eu_production_converged_report.py"
      - "tests/test_etf_eu_production_converged_report_contract.py"
      - ".github/workflows/validate-etf-eu-production-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded validator dependencies
        run: python -m pip install beautifulsoup4 pypdf

      - name: Compile validator
        run: python -m py_compile tools/validate_etf_eu_production_converged_report.py

      - name: Run positive and planted-failure tests
        run: python -m unittest tests.test_etf_eu_production_converged_report_contract -v
