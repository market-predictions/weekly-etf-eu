name: Validate ETF EU production engine convergence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/shared_exposure_ucits_map.yml"
      - "config/ucits_symbol_registry_sync_additions.yml"
      - "config/ucits_symbol_registry_sync_additions_wp09.yml"
      - "config/etf_eu_transition_evidence_cache_20260724.yml"
      - "config/etf_eu_incumbent_overlap_evidence_20260724.yml"
      - "config/etf_eu_transition_policy_v1.yml"
      - "runtime/build_etf_eu_production_convergence_state.py"
      - "runtime/promote_etf_eu_sister_report_to_production_candidate.py"
      - "tools/validate_etf_eu_production_convergence_state.py"
      - "tools/validate_etf_eu_production_converged_report.py"
      - "control/evidence/etf_eu_wp09_fresh_cutover_evidence_30501245612_1.json"
      - "control/work_packages/WP_SYNC_10_PRODUCTION_ENGINE_CONVERGENCE_20260803.md"
      - "control/claims/CLAIM_WP_SYNC_10_PRODUCTION_ENGINE_CONVERGENCE_20260803.md"
      - ".github/workflows/validate-etf-eu-production-convergence.yml"

permissions:
  contents: read

jobs:
  production-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP10_RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      DONOR_EVIDENCE_COMMIT: 52f13e190a9f6b0045df175973fdf8d0f6f5f30d
      REPORT_DATE: "2026-07-29"

    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Checkout current Weekly ETF donor evidence
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: 52f13e190a9f6b0045df175973fdf8d0f6f5f30d
          path: donor-weekly-etf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install weasyprint yfinance pypdf beautifulsoup4

      - name: Record protected state before generation
        run: |
          set -euo pipefail
          mkdir -p output/production_convergence
          sha256sum output/etf_eu_portfolio_state.json > output/production_convergence/protected_state_before.txt
          sha256sum output/etf_eu_trade_ledger.csv >> output/production_convergence/protected_state_before.txt

      - name: Build current donor and EU synchronization state
        run: |
          set -euo pipefail
          mkdir -p output/production_convergence/sync
          cd donor-weekly-etf
          python runtime/build_shared_strategy_state.py \
            --output ../output/production_convergence/sync/etf_shared_strategy_state.json
          python runtime/build_shared_portfolio_target.py \
            --shared-strategy-state ../output/production_convergence/sync/etf_shared_strategy_state.json \
            --output ../output/production_convergence/sync/etf_shared_portfolio_target.json
          python tools/validate_shared_strategy_state.py \
            ../output/production_convergence/sync/etf_shared_strategy_state.json
          python tools/validate_shared_portfolio_target.py \
            ../output/production_convergence/sync/etf_shared_portfolio_target.json
          cd ..
          python tools/validate_etf_eu_sync_registry_additions.py \
            config/ucits_symbol_registry_sync_additions.yml
          python tools/validate_etf_eu_sync_registry_additions.py \
            config/ucits_symbol_registry_sync_additions_wp09.yml
          python runtime/merge_etf_eu_sync_registries.py \
            --output output/production_convergence/sync/ucits_symbol_registry_sync_merged.yml
          python runtime/build_etf_eu_strategy_sync_shadow.py \
            --shared-strategy-state output/production_convergence/sync/etf_shared_strategy_state.json \
            --shared-portfolio-target output/production_convergence/sync/etf_shared_portfolio_target.json \
            --registry output/production_convergence/sync/ucits_symbol_registry_sync_merged.yml \
            --output output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python runtime/normalize_etf_eu_alignment_contract.py \
            output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python tools/validate_etf_eu_strategy_sync_shadow.py \
            output/production_convergence/sync/etf_eu_strategy_sync_shadow.json

      - name: Build policy allocator context
        run: |
          set -euo pipefail
          python pricing/build_etf_eu_transition_evidence.py \
            --report-date "$REPORT_DATE" \
            --output output/production_convergence/sync/etf_eu_transition_evidence.json
          python pricing/apply_etf_eu_transition_evidence_cache.py \
            output/production_convergence/sync/etf_eu_transition_evidence.json \
            --cache config/etf_eu_transition_evidence_cache_20260724.yml
          python runtime/build_etf_eu_target_allocator_shadow_v2.py \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json \
            --transition-evidence output/production_convergence/sync/etf_eu_transition_evidence.json \
            --output output/production_convergence/sync/etf_eu_target_allocator_shadow_v2.json
          python tools/validate_etf_eu_target_allocator_shadow_v2.py \
            output/production_convergence/sync/etf_eu_target_allocator_shadow_v2.json
          python runtime/build_etf_eu_incumbent_overlap_review.py \
            --output output/production_convergence/sync/etf_eu_incumbent_overlap_review.json
          python tools/validate_etf_eu_incumbent_overlap_review.py \
            output/production_convergence/sync/etf_eu_incumbent_overlap_review.json
          python runtime/build_etf_eu_target_allocator_shadow_v3_policy_gate.py \
            --base-allocator output/production_convergence/sync/etf_eu_target_allocator_shadow_v2.json \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json \
            --transition-evidence output/production_convergence/sync/etf_eu_transition_evidence.json \
            --overlap-review output/production_convergence/sync/etf_eu_incumbent_overlap_review.json \
            --policy config/etf_eu_transition_policy_v1.yml \
            --output output/production_convergence/sync/etf_eu_target_allocator_shadow.json
          python tools/validate_etf_eu_target_allocator_shadow_v3.py \
            output/production_convergence/sync/etf_eu_target_allocator_shadow.json

      - name: Render and finalize synchronized premium source report
        run: |
          set -euo pipefail
          mkdir -p output/production_convergence/source_report
          python runtime/render_etf_eu_sister_report_shadow.py \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json \
            --output-dir output/production_convergence/source_report
          SOURCE_MANIFEST="$(find output/production_convergence/source_report -maxdepth 1 -name 'etf_eu_sister_report_shadow_manifest_*.json' -print -quit)"
          test -n "$SOURCE_MANIFEST"
          echo "SOURCE_MANIFEST=$SOURCE_MANIFEST" >> "$GITHUB_ENV"
          python runtime/add_etf_eu_portfolio_alignment_surface.py \
            "$SOURCE_MANIFEST" \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python runtime/add_etf_eu_target_allocator_surface.py \
            "$SOURCE_MANIFEST" \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json
          python runtime/add_etf_eu_incumbent_overlap_surface.py \
            "$SOURCE_MANIFEST" \
            --review output/production_convergence/sync/etf_eu_incumbent_overlap_review.json
          python runtime/polish_etf_eu_sister_report_client_surface.py "$SOURCE_MANIFEST"
          python runtime/finalize_etf_eu_sister_report_nl_language.py "$SOURCE_MANIFEST"
          python runtime/reconcile_etf_eu_report_with_policy_allocator.py \
            "$SOURCE_MANIFEST" \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python runtime/reconcile_etf_eu_promoted_candidate_visibility.py \
            "$SOURCE_MANIFEST" \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python runtime/finalize_etf_eu_promoted_candidate_contract.py \
            "$SOURCE_MANIFEST" \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python runtime/finalize_etf_eu_policy_reconciliation_surface.py "$SOURCE_MANIFEST"
          python runtime/compact_etf_eu_policy_transition_surface.py "$SOURCE_MANIFEST"
          python runtime/fix_etf_eu_sister_report_layout.py "$SOURCE_MANIFEST"
          python runtime/finalize_etf_eu_policy_report_pagination.py "$SOURCE_MANIFEST"
          python runtime/finalize_etf_eu_report_output_contract.py \
            "$SOURCE_MANIFEST" \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json
          python tools/run_etf_eu_allocator_report_validation_bundle.py \
            "$SOURCE_MANIFEST" \
            --output output/production_convergence/source_report/source_report_validation_bundle.json

      - name: Build and validate production convergence state
        run: |
          set -euo pipefail
          STATE_PATH="output/production_convergence/etf_eu_production_convergence_state_${WP10_RUN_ID}.json"
          python runtime/build_etf_eu_production_convergence_state.py \
            --sync-shadow output/production_convergence/sync/etf_eu_strategy_sync_shadow.json \
            --allocator output/production_convergence/sync/etf_eu_target_allocator_shadow.json \
            --wp09-receipt control/evidence/etf_eu_wp09_fresh_cutover_evidence_30501245612_1.json \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --trade-ledger output/etf_eu_trade_ledger.csv \
            --donor-commit "$DONOR_EVIDENCE_COMMIT" \
            --run-id "$WP10_RUN_ID" \
            --output "$STATE_PATH"
          python tools/validate_etf_eu_production_convergence_state.py "$STATE_PATH" \
            | tee "output/production_convergence/etf_eu_production_convergence_state_validation_${WP10_RUN_ID}.json"
          echo "STATE_PATH=$STATE_PATH" >> "$GITHUB_ENV"

      - name: Promote synchronized source to client-facing production candidate
        run: |
          set -euo pipefail
          python runtime/promote_etf_eu_sister_report_to_production_candidate.py \
            "$SOURCE_MANIFEST" \
            --state "$STATE_PATH" \
            --output-dir output/production_convergence/client_report
          CLIENT_MANIFEST="$(find output/production_convergence/client_report -maxdepth 1 -name 'etf_eu_production_converged_report_manifest_*.json' -print -quit)"
          test -n "$CLIENT_MANIFEST"
          python tools/validate_etf_eu_production_converged_report.py \
            "$CLIENT_MANIFEST" \
            --state "$STATE_PATH" \
            --output "output/production_convergence/etf_eu_production_converged_report_validation_${WP10_RUN_ID}.json"
          echo "CLIENT_MANIFEST=$CLIENT_MANIFEST" >> "$GITHUB_ENV"

      - name: Prove official portfolio and ledger remained unchanged
        run: |
          set -euo pipefail
          sha256sum output/etf_eu_portfolio_state.json > output/production_convergence/protected_state_after.txt
          sha256sum output/etf_eu_trade_ledger.csv >> output/production_convergence/protected_state_after.txt
          diff -u output/production_convergence/protected_state_before.txt output/production_convergence/protected_state_after.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path(os.environ["STATE_PATH"]).read_text())
          manifest = json.loads(Path(os.environ["CLIENT_MANIFEST"]).read_text())
          if state["stage_1_decision"]["value"] != "blocked":
              raise SystemExit("WP10_STAGE_1_DECISION_NOT_BLOCKED")
          if state["stage_1_decision"]["executable_trade_intents"] != []:
              raise SystemExit("WP10_EXECUTABLE_TRADE_INTENTS_PRESENT")
          if manifest["authority"]["production_delivery_authority"] is not False:
              raise SystemExit("WP10_DELIVERY_AUTHORITY_ESCALATED")
          print("WP10_PROTECTED_STATE_OK | report_candidate_valid=true | stage_1=blocked")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-eu-production-convergence-${{ env.WP10_RUN_ID }}
          path: output/production_convergence/
          if-no-files-found: error
          retention-days: 90
