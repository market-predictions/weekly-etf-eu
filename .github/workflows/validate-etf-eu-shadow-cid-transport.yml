name: Validate ETF EU shadow CID transport

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime/send_etf_eu_shadow_cid_delivery.py"
      - "tools/validate_etf_eu_shadow_cid_transport.py"
      - ".github/workflows/send-etf-eu-shadow-cid-delivery.yml"
      - ".github/workflows/validate-etf-eu-shadow-cid-transport.yml"

permissions:
  contents: read
  actions: read

jobs:
  shadow-cid-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate latest green reconciled report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p output/shadow_cid/source output/shadow_cid/evidence
          SOURCE_RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Validate ETF EU allocator report shadow' \
            --branch 'sync/donor-report-parity' \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          if ! printf '%s' "$SOURCE_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "ETF_EU_SHADOW_CID_GREEN_SOURCE_NOT_FOUND" >&2
            exit 1
          fi
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name etf-eu-allocator-report-shadow \
            --dir output/shadow_cid/source
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Build and validate CID MIME without SMTP
        env:
          MRKT_RPRTS_MAIL_FROM: shadow-cid-test@example.invalid
          MRKT_RPRTS_MAIL_TO: shadow-cid-test@example.invalid
          MRKT_RPRTS_MAIL_TO_NL: shadow-cid-test@example.invalid
        run: |
          set -euo pipefail
          RUN_ID="dryrun_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python -m py_compile runtime/send_etf_eu_shadow_cid_delivery.py tools/validate_etf_eu_shadow_cid_transport.py
          python runtime/send_etf_eu_shadow_cid_delivery.py \
            --source-dir output/shadow_cid/source \
            --mode dry_run \
            --run-id "$RUN_ID" \
            --output "output/shadow_cid/evidence/etf_eu_shadow_cid_transport_${RUN_ID}.json"
          python tools/validate_etf_eu_shadow_cid_transport.py \
            "output/shadow_cid/evidence/etf_eu_shadow_cid_transport_${RUN_ID}.json" \
            | tee "output/shadow_cid/evidence/etf_eu_shadow_cid_transport_validation_${RUN_ID}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-eu-shadow-cid-transport-dry-run
          path: output/shadow_cid/evidence/
          if-no-files-found: error
          retention-days: 30
