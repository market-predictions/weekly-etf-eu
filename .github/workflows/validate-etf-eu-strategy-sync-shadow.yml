name: Validate ETF EU strategy synchronization shadow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/shared_exposure_ucits_map.yml"
      - "config/weekly_etf_donor_surface_contract.yml"
      - "runtime/build_etf_eu_strategy_sync_shadow.py"
      - "runtime/normalize_etf_eu_alignment_contract.py"
      - "runtime/render_etf_eu_sister_report_shadow.py"
      - "runtime/add_etf_eu_portfolio_alignment_surface.py"
      - "runtime/polish_etf_eu_sister_report_client_surface.py"
      - "runtime/fix_etf_eu_sister_report_layout.py"
      - "tools/validate_etf_eu_strategy_sync_shadow.py"
      - "tools/validate_etf_eu_sister_report_shadow.py"
      - "tools/validate_etf_eu_donor_surface_contract.py"
      - ".github/workflows/validate-etf-eu-strategy-sync-shadow.yml"
      - "docs/roadmaps/WEEKLY_ETF_US_EU_SYNCHRONIZATION_ROADMAP_20260727.md"
      - "control/work_packages/WP_SYNC_00_03_EU_DONOR_PARITY_20260727.md"

permissions:
  contents: read

jobs:
  strategy-sync-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Checkout donor Weekly ETF branch
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: sync/shared-strategy-state
          path: donor-weekly-etf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synchronization and rendering dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install weasyprint

      - name: Build donor shared strategy and portfolio target
        run: |
          mkdir -p output/sync_shadow
          cd donor-weekly-etf
          python runtime/build_shared_strategy_state.py --output ../output/sync_shadow/etf_shared_strategy_state.json
          python runtime/build_shared_portfolio_target.py \
            --shared-strategy-state ../output/sync_shadow/etf_shared_strategy_state.json \
            --output ../output/sync_shadow/etf_shared_portfolio_target.json
          python tools/validate_shared_strategy_state.py ../output/sync_shadow/etf_shared_strategy_state.json
          python tools/validate_shared_portfolio_target.py ../output/sync_shadow/etf_shared_portfolio_target.json

      - name: Build EU synchronization shadow
        run: |
          python runtime/build_etf_eu_strategy_sync_shadow.py \
            --shared-strategy-state output/sync_shadow/etf_shared_strategy_state.json \
            --shared-portfolio-target output/sync_shadow/etf_shared_portfolio_target.json \
            --output output/sync_shadow/etf_eu_strategy_sync_shadow.json

      - name: Normalize zero-weight exposure alignment
        run: |
          python runtime/normalize_etf_eu_alignment_contract.py \
            output/sync_shadow/etf_eu_strategy_sync_shadow.json

      - name: Validate EU synchronization shadow
        run: |
          python tools/validate_etf_eu_strategy_sync_shadow.py output/sync_shadow/etf_eu_strategy_sync_shadow.json

      - name: Render donor-structure EU sister report shadow
        run: |
          python runtime/render_etf_eu_sister_report_shadow.py \
            --sync-shadow output/sync_shadow/etf_eu_strategy_sync_shadow.json \
            --output-dir output/sync_shadow/report

      - name: Add donor-to-EU portfolio alignment surface
        run: |
          python runtime/add_etf_eu_portfolio_alignment_surface.py \
            output/sync_shadow/report/etf_eu_sister_report_shadow_manifest_20260724.json \
            --sync-shadow output/sync_shadow/etf_eu_strategy_sync_shadow.json

      - name: Polish bilingual client surface
        run: |
          python runtime/polish_etf_eu_sister_report_client_surface.py \
            output/sync_shadow/report/etf_eu_sister_report_shadow_manifest_20260724.json

      - name: Apply narrow layout fixes
        run: |
          python runtime/fix_etf_eu_sister_report_layout.py \
            output/sync_shadow/report/etf_eu_sister_report_shadow_manifest_20260724.json

      - name: Validate sister-report section, table and chart contract
        run: |
          python tools/validate_etf_eu_sister_report_shadow.py \
            output/sync_shadow/report/etf_eu_sister_report_shadow_manifest_20260724.json

      - name: Validate exact donor surface contract
        run: |
          python tools/validate_etf_eu_donor_surface_contract.py \
            output/sync_shadow/report/etf_eu_sister_report_shadow_manifest_20260724.json

      - uses: actions/upload-artifact@v4
        with:
          name: etf-eu-strategy-sync-shadow
          path: |
            output/sync_shadow/etf_shared_strategy_state.json
            output/sync_shadow/etf_shared_portfolio_target.json
            output/sync_shadow/etf_eu_strategy_sync_shadow.json
            output/sync_shadow/report/
          if-no-files-found: error
