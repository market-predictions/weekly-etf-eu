name: Validate ETF EU transition composition replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "config/weekly_etf_donor_contract_pin.json"
      - "config/etf_eu_transition_replay_universe.yml"
      - "config/etf_eu_transition_policy_v1.yml"
      - "config/etf_eu_euna_risk_budget_policy_v1.yml"
      - "config/etf_eu_stage_2_transition_policy_v1.yml"
      - "config/etf_eu_cutover_product_evidence_20260728.yml"
      - "config/etf_eu_incumbent_overlap_evidence_20260724.yml"
      - "config/etf_eu_transition_evidence_cache_20260724.yml"
      - "output/etf_eu_portfolio_state.json"
      - "control/ETF_EU_STAGE_2_TRANSITION_AND_ROLLBACK_CONTRACT_V1.md"
      - "pricing/build_etf_eu_transition_replay_panel.py"
      - "runtime/build_etf_eu_transition_replay.py"
      - "runtime/build_etf_eu_euna_risk_budget_review.py"
      - "runtime/build_etf_eu_euna_risk_budget_review_jsonsafe.py"
      - "runtime/build_etf_eu_stage_2_readiness.py"
      - "runtime/build_etf_eu_stage_2_readiness_v2.py"
      - "runtime/build_etf_eu_incumbent_overlap_review.py"
      - "runtime/build_etf_eu_target_allocator_shadow_v3.py"
      - "runtime/build_etf_eu_target_allocator_shadow_v3_policy_gate.py"
      - "tools/validate_etf_eu_target_allocator_shadow_v3.py"
      - "tools/validate_etf_eu_target_allocator_shadow_v3_activated.py"
      - "tests/test_etf_eu_target_allocator_activated_candidate_reconciliation.py"
      - "tools/validate_etf_eu_transition_replay.py"
      - "tools/validate_etf_eu_euna_risk_budget_review.py"
      - "tools/validate_etf_eu_stage_2_readiness.py"
      - "tools/validate_weekly_etf_donor_contract_pin.py"
      - ".github/workflows/validate-etf-eu-transition-replay.yml"

permissions:
  contents: read

jobs:
  transition-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Weekly ETF EU
        uses: actions/checkout@v4

      - name: Validate immutable donor contract pin
        run: |
          python tools/validate_weekly_etf_donor_contract_pin.py \
            config/weekly_etf_donor_contract_pin.json

      - name: Checkout donor Weekly ETF contract v1.0.0
        uses: actions/checkout@v4
        with:
          repository: market-predictions/weekly-etf
          ref: 455201b4736dda41df07644d78b6797282a29fc7
          path: donor-weekly-etf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install yfinance pandas numpy pytest

      - name: Validate activated candidate reconciliation contract
        run: |
          python -m pytest -q tests/test_etf_eu_target_allocator_activated_candidate_reconciliation.py

      - name: Build donor and synchronization artifacts
        run: |
          mkdir -p output/sync_shadow
          cd donor-weekly-etf
          python runtime/build_shared_strategy_state.py --output ../output/sync_shadow/etf_shared_strategy_state.json
          python runtime/build_shared_portfolio_target.py \
            --shared-strategy-state ../output/sync_shadow/etf_shared_strategy_state.json \
            --output ../output/sync_shadow/etf_shared_portfolio_target.json
          python tools/validate_shared_strategy_state.py ../output/sync_shadow/etf_shared_strategy_state.json
          python tools/validate_shared_portfolio_target.py ../output/sync_shadow/etf_shared_portfolio_target.json
          cd ..
          python tools/validate_etf_eu_sync_registry_additions.py config/ucits_symbol_registry_sync_additions.yml
          python runtime/merge_etf_eu_sync_registries.py \
            --output output/sync_shadow/ucits_symbol_registry_sync_merged.yml
          python runtime/build_etf_eu_strategy_sync_shadow.py \
            --shared-strategy-state output/sync_shadow/etf_shared_strategy_state.json \
            --shared-portfolio-target output/sync_shadow/etf_shared_portfolio_target.json \
            --registry output/sync_shadow/ucits_symbol_registry_sync_merged.yml \
            --output output/sync_shadow/etf_eu_strategy_sync_shadow.json
          python runtime/normalize_etf_eu_alignment_contract.py output/sync_shadow/etf_eu_strategy_sync_shadow.json
          python tools/validate_etf_eu_strategy_sync_shadow.py output/sync_shadow/etf_eu_strategy_sync_shadow.json

      - name: Build policy-driven allocator against authoritative portfolio state
        run: |
          python pricing/build_etf_eu_transition_evidence.py \
            --report-date 2026-07-27 \
            --output output/sync_shadow/etf_eu_transition_evidence.json
          python pricing/apply_etf_eu_transition_evidence_cache.py \
            output/sync_shadow/etf_eu_transition_evidence.json \
            --cache config/etf_eu_transition_evidence_cache_20260724.yml
          python runtime/build_etf_eu_target_allocator_shadow_v2.py \
            --sync-shadow output/sync_shadow/etf_eu_strategy_sync_shadow.json \
            --transition-evidence output/sync_shadow/etf_eu_transition_evidence.json \
            --output output/sync_shadow/etf_eu_target_allocator_shadow_v2.json
          python tools/validate_etf_eu_target_allocator_shadow_v2.py \
            output/sync_shadow/etf_eu_target_allocator_shadow_v2.json
          python runtime/build_etf_eu_incumbent_overlap_review.py \
            --output output/sync_shadow/etf_eu_incumbent_overlap_review.json
          python tools/validate_etf_eu_incumbent_overlap_review.py \
            output/sync_shadow/etf_eu_incumbent_overlap_review.json
          python runtime/build_etf_eu_target_allocator_shadow_v3_policy_gate.py \
            --base-allocator output/sync_shadow/etf_eu_target_allocator_shadow_v2.json \
            --sync-shadow output/sync_shadow/etf_eu_strategy_sync_shadow.json \
            --portfolio-state output/etf_eu_portfolio_state.json \
            --transition-evidence output/sync_shadow/etf_eu_transition_evidence.json \
            --overlap-review output/sync_shadow/etf_eu_incumbent_overlap_review.json \
            --policy config/etf_eu_transition_policy_v1.yml \
            --output output/sync_shadow/etf_eu_target_allocator_shadow.json
          python tools/validate_etf_eu_target_allocator_shadow_v3_activated.py \
            output/sync_shadow/etf_eu_target_allocator_shadow.json \
            --portfolio-state output/etf_eu_portfolio_state.json

      - name: Build and validate transition replay
        run: |
          python pricing/build_etf_eu_transition_replay_panel.py \
            --universe config/etf_eu_transition_replay_universe.yml \
            --output output/sync_shadow/etf_eu_transition_replay_panel.json
          python runtime/build_etf_eu_transition_replay.py \
            --panel output/sync_shadow/etf_eu_transition_replay_panel.json \
            --allocator output/sync_shadow/etf_eu_target_allocator_shadow.json \
            --output output/sync_shadow/etf_eu_transition_replay.json
          python tools/validate_etf_eu_transition_replay.py \
            output/sync_shadow/etf_eu_transition_replay.json

      - name: Build and validate EUNA risk-budget review
        run: |
          python runtime/build_etf_eu_euna_risk_budget_review_jsonsafe.py \
            --panel output/sync_shadow/etf_eu_transition_replay_panel.json \
            --allocator output/sync_shadow/etf_eu_target_allocator_shadow.json \
            --policy config/etf_eu_euna_risk_budget_policy_v1.yml \
            --output output/sync_shadow/etf_eu_euna_risk_budget_review.json
          python tools/validate_etf_eu_euna_risk_budget_review.py \
            output/sync_shadow/etf_eu_euna_risk_budget_review.json

      - name: Build and validate blocked Stage-2 readiness
        run: |
          python runtime/build_etf_eu_stage_2_readiness_v2.py \
            --allocator output/sync_shadow/etf_eu_target_allocator_shadow.json \
            --sync-shadow output/sync_shadow/etf_eu_strategy_sync_shadow.json \
            --product-evidence config/etf_eu_cutover_product_evidence_20260728.yml \
            --euna-review output/sync_shadow/etf_eu_euna_risk_budget_review.json \
            --donor-pin config/weekly_etf_donor_contract_pin.json \
            --policy config/etf_eu_stage_2_transition_policy_v1.yml \
            --output output/sync_shadow/etf_eu_stage_2_readiness.json
          python tools/validate_etf_eu_stage_2_readiness.py \
            output/sync_shadow/etf_eu_stage_2_readiness.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etf-eu-transition-composition-replay
          path: |
            config/weekly_etf_donor_contract_pin.json
            config/etf_eu_euna_risk_budget_policy_v1.yml
            config/etf_eu_stage_2_transition_policy_v1.yml
            config/etf_eu_cutover_product_evidence_20260728.yml
            output/etf_eu_portfolio_state.json
            control/ETF_EU_STAGE_2_TRANSITION_AND_ROLLBACK_CONTRACT_V1.md
            output/sync_shadow/etf_eu_target_allocator_shadow.json
            output/sync_shadow/etf_eu_incumbent_overlap_review.json
            output/sync_shadow/etf_eu_transition_replay_panel.json
            output/sync_shadow/etf_eu_transition_replay.json
            output/sync_shadow/etf_eu_euna_risk_budget_review.json
            output/sync_shadow/etf_eu_stage_2_readiness.json
          if-no-files-found: error
