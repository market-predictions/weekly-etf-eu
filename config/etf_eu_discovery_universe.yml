schema_version: etf_eu_discovery_universe_v2
universe_type: ucits_research_and_mapping_candidates
authority_contract: control/ETF_EU_ALLOCATION_AUTHORITY_CONVERGENCE_V1.md

rules:
  us_etfs_allowed_as_research_proxies_only: true
  funded_candidates_require_ucits_verification: true
  canonical_identity: isin_plus_exact_trading_line
  research_lane_may_exist_without_ucits_mapping: true
  missing_ucits_mapping_blocks_funding_not_research: true
  historical_stage1_allowlist_is_discovery_gate: false
  minimum_assessed_breadth_buckets: 12
  target_candidate_lanes_min: 10
  target_candidate_lanes_max: 15
  minimum_challengers: 4
  promoted_live_radar_min: 5
  promoted_live_radar_max: 8
  donor_target_weight_is_allocation_authority: false

required_breadth_buckets:
  - ai_digital_infrastructure
  - defense_resilience
  - grid_power_electrification
  - uranium_nuclear
  - agriculture_food_security
  - water
  - china
  - india_regional_industrialization
  - biotech_healthcare_innovation
  - fintech_financial_infrastructure
  - robotics_automation
  - critical_minerals_materials

lanes:
