registry_rules:
  - Current funded/unfunded status must be derived from output/etf_eu_portfolio_state.json, never from this registry.
  - Ticker alone is insufficient identity.
  - Broker/account permissions are outside the broker-neutral model-investability gate.
  - U.S.-listed ETFs are research references only and may not be funded in the EU model.
